<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e08a3c">
<meta name="color-scheme" content="light dark">
<title>캉캉 노트</title>
<!--
  캉캉 노트 - 반려견(봄이) 관리 · 가족 공유 · 단일 HTML + Firebase(Firestore, 익명 로그인)

  [사용 방법]
  1) HTTPS 주소(GitHub Pages 등)에 올려서 가족 폰에서 엽니다. 파일을 직접 열면 동작하지 않아요.
  2) 처음 쓰는 사람: "가족 만들기" → 가족 코드를 가족에게 알려줍니다. 나머지 가족: "가족 코드로 참여".
  3) 하단 탭: 홈 / 캘린더 / 소모품 / 추억 / 더보기(기록 관리·기준 설정·백업)

  [산책 지도 안내]
  - 산책 중에는 앱 화면을 켜 둬야 GPS 경로가 끊기지 않아요(화면이 꺼지지 않게 자동 유지).
  - 지도는 배경 없이 경로만 그려서 가벼워요.

  [백업 안내]
  - 사진은 줄여서 Firestore에 저장돼요(무료 1GB). 가득 차기 전에 기준 → 백업 → 사진 정리를 쓰세요.
-->
<style>
/* ========== 테마 (CSS 변수) ========== */
:root{--bg:#faf6f1;--c:#fff;--t:#2b2118;--s:#7d6e62;--p:#e08a3c;--ln:#eadfd3;--soft:#fdeedd;--g:#2f9e62;--r:#d64545;--o:#e0892a}
@media (prefers-color-scheme:dark){
 :root{--bg:#171310;--c:#221c17;--t:#f3ebe3;--s:#b0a193;--p:#f0a050;--ln:#3a3029;--soft:#33271c;--g:#4cc58a;--r:#ff7070;--o:#f2a24a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.5 -apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* ========== 레이아웃 ========== */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ln);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px}
#av{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--p);cursor:pointer;background:var(--soft)}
#ht{flex:1;font-weight:800;font-size:20px}
#sync{font-size:13px;color:var(--s)}
main{max-width:640px;margin:0 auto;padding:14px}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--c);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav#tabs a{flex:1;text-align:center;padding:8px 0 6px;font-size:12.5px;color:var(--s)}
nav#tabs a b{display:block;font-size:26px;line-height:1.15}
nav#tabs a.on{color:var(--p);font-weight:800}

/* ========== 카드·버튼·입력 ========== */
.card{background:var(--c);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h2{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:400;color:var(--s);font-size:13px}
.sub{color:var(--s);font-size:14px}
.msg{margin:4px 0 14px;font-size:17px;white-space:pre-line}
.btn{border:0;background:var(--p);color:#fff;border-radius:14px;padding:14px 18px;min-height:52px;font-weight:800;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--t)}
.btn.red{background:var(--r);color:#fff}
.btn.sm{padding:8px 14px;min-height:40px;font-size:15px}
.btn.block{display:block;width:100%;margin-top:10px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;margin-top:16px}
.row .btn{flex:1}
input,select,textarea{width:100%;border:1px solid var(--ln);background:var(--c);color:var(--t);border-radius:14px;padding:13px 14px;font:inherit;min-width:0}
textarea{min-height:84px;resize:vertical}
.lbl{font-size:14px;color:var(--s);margin:14px 0 6px}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ln);background:var(--c);border-radius:24px;padding:9px 16px;font-size:16px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:800}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.ck{display:flex;gap:10px;align-items:center;margin-top:12px}.ck input{width:22px;height:22px}
.bigrow{display:flex;align-items:center;gap:14px;width:100%;border:1px solid var(--ln);background:var(--c);border-radius:18px;padding:20px 18px;font-size:19px;font-weight:700;margin-bottom:12px;cursor:pointer;text-align:left}
.bigrow b{font-size:30px}

/* ========== 의미 색 ========== */
.t-good{background:var(--g)}.t-warn{background:var(--o)}.t-bad{background:var(--r)}.t-pend{background:var(--s)}
.c-good{color:var(--g)}.c-warn{color:var(--o)}.c-bad{color:var(--r)}
.dot{display:inline-block;width:15px;height:15px;border-radius:50%;margin:1px;vertical-align:middle}
.tag{display:inline-block;font-size:13px;border-radius:10px;padding:2px 9px;background:var(--soft);color:var(--t)}
.tag.red{background:var(--r);color:#fff}.tag.orange{background:var(--o);color:#fff}.tag.green{background:var(--g);color:#fff}

/* ========== 홈 ========== */
.hero{display:flex;gap:14px;align-items:center;background:var(--soft)}
.avbig{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--p);flex:none}
.hero .nm{font-size:24px;font-weight:800}
.banner{border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:17px;font-weight:700;cursor:pointer}
.banner small{font-weight:400;font-size:14px;opacity:.95}
.banner.red{background:var(--r);color:#fff}.banner.orange{background:var(--o);color:#fff}.banner.green{background:var(--g);color:#fff}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.act{border:0;border-radius:24px;min-height:140px;font-size:23px;font-weight:800;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:8px}
.act b{font-size:46px;line-height:1.1}
.act small{font-size:14px;font-weight:600;opacity:.92}
.a-poop{background:#b9783f}.a-walk{background:#2f9e62}.a-walk.on{background:#d64545}.a-walk.other{background:#8a8076}
.a-meal{background:#e08a3c}.a-snack{background:#8a6fd6}
.sr{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--ln);font-size:18px}
.sr:first-child{border-top:0}
.sr span{flex:1}.sr b{font-size:20px}.sr small{color:var(--s);font-size:13px;min-width:90px;text-align:right}
.sr button{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--c);font-size:22px;cursor:pointer}
.big{font-size:30px;font-weight:800}
.week{display:flex;gap:4px}.week .d{flex:1;text-align:center}
.week .stk{min-height:42px;display:flex;flex-direction:column-reverse;align-items:center}
.week .lb{font-size:12px;color:var(--s)}.week .lb.today{color:var(--p);font-weight:800}
.hbar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:4px}
.hbar i{display:block;height:100%;background:var(--p)}
.hbar.warn i{background:var(--o)}.hbar.bad i{background:var(--r)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal button{position:relative;border:0;padding:0;border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--soft);cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;text-align:center}
.gal i{position:absolute;top:5px;right:5px;width:12px;height:12px;border-radius:50%;border:2px solid #fff}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--ln)}
.li:first-of-type{border-top:0}
.map{width:100%;aspect-ratio:1;border-radius:16px;background:var(--soft);display:block}
.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pagehead h1{margin:0;font-size:22px}

/* ========== 캘린더 ========== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:14px;color:var(--s);padding:4px 0}
.cd{aspect-ratio:1/1.2;border:1px solid var(--ln);background:var(--c);border-radius:12px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-size:16px}
.cd.today{border:2.5px solid var(--p)}.cd.out{opacity:.25;pointer-events:none}.cd.sun{color:var(--r)}
.cd .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:4px}
.cd .dots i,.lg i{width:12px;height:12px;border-radius:50%;display:inline-block;background:var(--k)}
.cd .dots i.ring,.lg i.ring{background:transparent;border:3px solid var(--k)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--s);margin:10px 2px}
.lg span{display:flex;align-items:center;gap:5px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mnav b{font-size:21px}.mnav button{width:52px;height:46px;border-radius:14px;border:1px solid var(--ln);background:var(--c);font-size:22px;cursor:pointer}

/* ========== 목록·카드 ========== */
.dh{display:flex;justify-content:space-between;font-size:14px;color:var(--s);margin:16px 2px 8px}
.rec{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.rec .rt{display:flex;justify-content:space-between;gap:8px}
.rec .rt b{font-size:17px}
.rec .by{font-size:13px;color:var(--s);white-space:nowrap}
.rec .rs{font-size:15px;color:var(--s);margin-top:3px;word-break:break-word}
.th{width:72px;height:72px;object-fit:cover;border-radius:12px;margin:8px 6px 0 0;cursor:pointer;border:1px solid var(--ln)}
.rec .del{float:right;border:0;background:none;color:var(--r);font-size:15px;cursor:pointer;padding:4px 6px}
.flash{outline:2.5px solid var(--p)}
.trip{padding:0;overflow:hidden}
.trip .cv{width:100%;height:190px;object-fit:cover;display:block;background:var(--soft)}
.trip .tb{padding:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fr{background:var(--c);border:1px solid var(--ln);border-radius:18px;padding:16px 10px;text-align:center;cursor:pointer}
.fr img,.fr .noimg{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--p);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--soft)}
.fr b{font-size:19px;display:block}
.sup{border-left:6px solid var(--ln)}
.sup.late{border-left-color:var(--r)}.sup.soon{border-left-color:var(--o)}

/* ========== 바텀시트 ========== */
.mbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.sheet h3{margin:0 0 8px;font-size:20px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.phs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ph{position:relative;width:84px;height:84px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid var(--ln)}
.ph button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--r);color:#fff;cursor:pointer;line-height:1;font-size:16px}
.src{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.src button{border:1.5px solid var(--ln);background:var(--c);border-radius:16px;padding:12px 4px;font-size:14px;font-weight:700;cursor:pointer}
.src button b{display:block;font-size:28px}
.pv img{width:100%;max-height:62vh;object-fit:contain;border-radius:14px;background:#000}
.pv .sub{white-space:pre-line;margin-top:8px}
.scorebtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid var(--ln);background:var(--c);border-radius:16px;padding:14px;margin-bottom:8px;cursor:pointer;font-size:18px}
.scorebtn.on{border-color:var(--p);background:var(--soft);font-weight:800}
.scorebtn b{width:24px;font-size:20px}
.trow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.trow .ro{min-width:26px;color:var(--s)}
.trow .x{border:0;background:none;color:var(--r);font-size:26px;cursor:pointer}
.crop{position:relative;overflow:hidden;border-radius:12px;background:#000}
.crop img{width:100%;display:block}
.cm{position:absolute;left:0;right:0;background:rgba(0,0,0,.62)}
.cm.top{top:0;border-bottom:2px solid var(--p)}.cm.bot{bottom:0;border-top:2px solid var(--p)}
input[type=range]{padding:0;height:34px;accent-color:var(--p)}

/* ========== 토스트·진행 ========== */
#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:#222;color:#fff;border-radius:24px;padding:12px 18px;font-size:16px;max-width:92vw;display:none;text-align:center}
#toast button{margin-left:12px;background:none;border:0;color:#ffd27a;font-weight:800;font-size:16px;cursor:pointer}
#prog{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center}
#prog div{background:var(--c);border-radius:18px;padding:22px 26px;text-align:center;max-width:80vw;white-space:pre-line;font-size:17px}
.code{font-size:28px;font-weight:800;letter-spacing:2px;text-align:center;background:var(--soft);border-radius:16px;padding:16px;margin:10px 0;user-select:all}
.empty{color:var(--s);text-align:center;padding:24px 0;font-size:16px}
</style>
</head>

<script>
/* 시작 실패 안내: 앱이 뜨지 못하면 '불러오는 중'에서 멈추지 않고 원인을 보여줍니다. */
window.__fatal = function (msg) {
  var a = document.getElementById('app');
  if (!a) return;
  a.innerHTML = '<div class="card"><h2>⚠️ 앱을 시작하지 못했어요</h2><p class="msg"></p></div>';
  a.querySelector('.msg').textContent = msg;
};
window.addEventListener('error', function (e) { if (!window.__ready) window.__fatal('오류: ' + (e.message || e)); });
window.addEventListener('unhandledrejection', function (e) { if (!window.__ready) window.__fatal('오류: ' + ((e.reason && e.reason.message) || e.reason)); });
setTimeout(function () {
  if (!window.__ready) window.__fatal(location.protocol === 'file:'
    ? '파일을 직접 열면 동작하지 않아요.\nHTTPS 주소(웹 호스팅)에 올려서 그 주소로 열어야 해요.'
    : '10초가 지나도 시작되지 않았어요.\n인터넷 연결을 확인하고 새로고침해 주세요.');
}, 10000);
</script>

function loadImg(file) {

    i.onload = () => { URL.revokeObjectURL(u); res(i); };

    i.src = u;
  });
}

  const t = crop ? crop.t : 0, b = crop ? crop.b : 0;
  const sy = Math.round(img.height * t), sh = Math.max(1, Math.round(img.height * (1 - t - b)));
  const k = Math.min(1, max / Math.max(img.width, sh));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(sh * k));
  c.getContext('2d').drawImage(img, 0, sy, img.width, sh, 0, 0, c.width, c.height);

}

}

  const clean = clone(rec);

/* =====================================================================

   ===================================================================== */
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }

  for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

const u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
function zipBuild(files) {
  const enc = new TextEncoder(), parts = [], cen = [];

    const lh = new Uint8Array([0x50, 0x4b, 3, 4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21),
      ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0)]);
    parts.push(lh, nm, f.data);
    cen.push(new Uint8Array([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21),
      ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nm);
    off += lh.length + nm.length + sz;

  cen.forEach(c => cdSize += c.length);
  const end = new Uint8Array([0x50, 0x4b, 5, 6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(off), ...u16(0)]);

async function zipRead(file) {
  const size = file.size;
  const tail = new Uint8Array(await file.slice(Math.max(0, size - 65557), size).arrayBuffer());
  let p = -1;
  for (let i = tail.length - 22; i >= 0; i--) {
    if (tail[i] === 0x50 && tail[i + 1] === 0x4b && tail[i + 2] === 5 && tail[i + 3] === 6) { p = i; break; }
  }
  if (p < 0) throw new Error('zip 파일이 아니에요');
  const tv = new DataView(tail.buffer);
  const n = tv.getUint16(p + 10, true), cdSize = tv.getUint32(p + 12, true), cdOff = tv.getUint32(p + 16, true);
  const cdBuf = await file.slice(cdOff, cdOff + cdSize).arrayBuffer();
  const cd = new DataView(cdBuf), cdu = new Uint8Array(cdBuf), dec = new TextDecoder();
  const ent = new Map();
  let q = 0;
  for (let i = 0; i < n; i++) {
    const method = cd.getUint16(q + 10, true), csz = cd.getUint32(q + 20, true);
    const nl = cd.getUint16(q + 28, true), xl = cd.getUint16(q + 30, true), cl = cd.getUint16(q + 32, true);
    const lo = cd.getUint32(q + 42, true);
    ent.set(dec.decode(cdu.subarray(q + 46, q + 46 + nl)), { method, csz, lo });
    q += 46 + nl + xl + cl;
  }
  return {
    names: [...ent.keys()],
    async get(name) {
      const e = ent.get(name);
      if (!e) return null;
      if (e.method !== 0) throw new Error('압축된 zip은 지원하지 않아요');
      const lh = new DataView(await file.slice(e.lo, e.lo + 30).arrayBuffer());
      const start = e.lo + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
      return new Uint8Array(await file.slice(start, start + e.csz).arrayBuffer());
    }
  };
}

function mapSvg(r) {

    <polyline points="${poly}" fill="none" stroke="var(--p)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${tx(s0[0])}" cy="${ty(s0[1])}" r="8" fill="var(--r)" stroke="#fff" stroke-width="2"/>
    <circle cx="${tx(s1[0])}" cy="${ty(s1[1])}" r="8" fill="#2563eb" stroke="#fff" stroke-width="2"/>

  </svg>`;
}

function calMap(y, m) {
  const mp = {}, pre = `${y}-${pad(m + 1)}`;
  const add = (d, cat, ring) => { (mp[d] = mp[d] || {})[cat + (ring ? '~' : '')] = 1; };
  for (const r of RECS.values()) {
    if (!r.date || !r.date.startsWith(pre)) continue;
    if (r.type === 'event') add(r.date, r.cat || '기타');
    else if (r.type === 'health') add(r.date, kindCat(r.kind));
    else if (r.type === 'buy') add(r.date, '소모품');
  }
  for (const s of SUPS.values()) if (s.next && s.next.startsWith(pre)) add(s.next, '소모품', true);
  for (const x of schedAll()) if (x.due && x.due.startsWith(pre)) add(x.due, kindCat(x.name), true);
  return mp;
}

  rec.type = type; rec.date = o.date;

  if (type === 'poop') {
    if (!o.score) return toast('변 상태를 골라 주세요');
    Object.assign(rec, { score: +o.score, color: o.color || '', amount: o.amount || '', mucus: !!o.mucus, foreign: !!o.foreign, memo: o.memo.trim() });
  } else if (type === 'health') {
    if (!o.kind) return toast('항목을 골라 주세요');
    rec.kind = o.kind; rec.memo = o.memo.trim();
    const w = num(o.weight);
    if (w > 0) rec.weight = w; else delete rec.weight;
    if (o.kind === '체중' && !(w > 0)) return toast('체중을 입력해 주세요');
  } else if (type === 'walk') {
    const m = num(o.min);
    if (!(m > 0)) return toast('산책 시간(분)을 입력해 주세요');
    Object.assign(rec, { min: m, memo: o.memo.trim() });
    const km = num(o.km);
    if (km > 0) rec.km = km; else delete rec.km;
  } else if (type === 'expense') {
    const a = num(o.amount);
    if (!(a > 0)) return toast('금액을 입력해 주세요');
    Object.assign(rec, { cat: o.cat || '기타', amount: a, memo: o.memo.trim() });
  } else if (type === 'memo') {
    const keep = (rec.photos || []).filter(p => !removed.includes(p.id)).length + newPh.length;
    if (!o.text.trim() && !keep) return toast('내용이나 사진을 넣어 주세요');
    rec.text = o.text.trim();
  } else if (type === 'event') {
    if (!o.title.trim()) return toast('제목을 입력해 주세요');
    Object.assign(rec, { cat: o.cat || '기타', title: o.title.trim(), memo: o.memo.trim() });
  } else if (type === 'trip') {
    if (!o.place.trim()) return toast('어디를 갔는지 입력해 주세요');
    Object.assign(rec, { place: o.place.trim(), end: o.end || '', who: o.who.trim(), note: o.note.trim() });
  }
  if (old && old.by !== ME) rec.editedBy = ME;
  saveRec(rec, newPh, removed);
  UI.flash = rec.id; saveUI();
  closeM(); toast('저장했어요');
  setTimeout(() => { UI.flash = ''; }, 2200);
}

   15. 백업 · 복구 · 사진 정리
   ===================================================================== */
const PART_LIMIT = 60 * 1048576;
async function backupRange(from, to, withPhotos, label) {
  if (!navigator.onLine) { toast('인터넷 연결이 필요해요'); return null; }
  prog('기록 불러오는 중…');
  let recs;
  try {
    const s = await getDocs(query(fcol('records'), where('date', '>=', from), where('date', '<=', to)));
    recs = s.docs.map(d => ({ ...d.data(), id: d.id })).sort(cmpAsc);
  } catch (e) { prog(''); fail(e); return null; }
  const stamp = today();
  const head = { app: APP_ID, version: 2, exportedAt: new Date().toISOString(), range: [from, to],
    fam: { dog: FAM.dog, members: FAM.members, admin: FAM.admin },
    supplies: [...SUPS.values()], friends: [...FRS.values()] };
  if (!withPhotos) {
    download(new Blob([JSON.stringify({ ...head, records: recs })], { type: 'application/json' }), `캉캉노트_기록_${stamp}.json`);
    famSet({ lastBackup: stamp }); prog('');
    toast(`기록 ${recs.length}건을 내려받았어요 (사진 원본 제외)`);
    return recs;
  }
  const total = recs.reduce((a, r) => a + (r.photos || []).filter(p => !p.x).length, 0);
  let bucket = { files: [], recs: [], bytes: 0 }, part = 0, done = 0;
  const flush = async () => {
    if (!bucket.recs.length) return;
    part++;
    const json = new TextEncoder().encode(JSON.stringify({ ...head, part, records: bucket.recs }));
    download(zipBuild([{ name: 'data.json', data: json }, ...bucket.files]), `캉캉노트_${label}_${stamp}_${part}.zip`);
    bucket = { files: [], recs: [], bytes: 0 };
    await sleep(900);
  };
  try {
    for (const r of recs) {
      for (const p of (r.photos || [])) {
        if (p.x) continue;
        prog(`사진 담는 중… ${++done}/${total}`);
        const d = await getDoc(phRef(p.id));
        if (d.exists()) { const u = dataUrlToU8(d.data().data); bucket.files.push({ name: `photos/${p.id}.jpg`, data: u }); bucket.bytes += u.length; }
      }
      bucket.recs.push(r);
      if (bucket.bytes >= PART_LIMIT) await flush();
    }
    await flush();
  } catch (e) { prog(''); fail(e); return null; }
  famSet({ lastBackup: stamp }); prog('');
  toast(`백업 ${part}개 파일을 내려받았어요`);
  return recs;
}
function openBackup() {

    <div class="two"><div><div class="lbl">시작일</div><input id="bf" type="date" value="${from}"></div><div><div class="lbl">종료일</div><input id="bt" type="date" value="${to}"></div></div>

async function restoreFiles(files) {
  if (!navigator.onLine) return toast('인터넷 연결이 필요해요');
  let nRec = 0, nPh = 0;
  try {
    for (const f of files) {
      prog(`${f.name} 읽는 중…`);
      let data, zip = null;
      if (/\.json$/i.test(f.name)) data = JSON.parse(await f.text());
      else { zip = await zipRead(f); const j = await zip.get('data.json'); if (!j) throw new Error('data.json이 없어요'); data = JSON.parse(new TextDecoder().decode(j)); }
      if (data.app !== APP_ID) throw new Error('캉캉 노트 백업 파일이 아니에요');
      const recs = data.records || [];
      let batch = writeBatch(db), n = 0;
      for (const r of recs) {
        const { id, ...body } = r;
        batch.set(recRef(id), body); n++; nRec++;
        if (n >= 400) { await batch.commit(); batch = writeBatch(db); n = 0; prog(`기록 복구 ${nRec}건…`); }
      }
      for (const s of (data.supplies || [])) { const { id, ...b } = s; batch.set(supRef(id), b); n++; }
      for (const s of (data.friends || [])) { const { id, ...b } = s; batch.set(frRef(id), b); n++; }
      if (n) await batch.commit();
      if (zip) {
        let pb = writeBatch(db), pn = 0;
        for (const name of zip.names.filter(x => x.startsWith('photos/'))) {
          const pid = name.slice(7).replace(/\.jpg$/, '');
          const owner = recs.find(r => (r.photos || []).some(p => p.id === pid));
          const dataUrl = await u8ToDataUrl(await zip.get(name));
          pb.set(phRef(pid), { data: dataUrl, rid: owner ? owner.id : '', size: dataUrl.length, date: owner ? owner.date : '' });
          pn++; nPh++;
          if (pn >= 15) { await pb.commit(); pb = writeBatch(db); pn = 0; prog(`사진 복구 ${nPh}장…`); }
        }
        if (pn) await pb.commit();
      }
    }
  } catch (e) { prog(''); console.error(e); return toast('복구 실패: ' + (e.message || '파일을 확인해 주세요')); }
  prog('');
  await recount(true);
  toast(`복구 완료: 기록 ${nRec}건, 사진 ${nPh}장`);
}
async function recount(silent) {
  if (!navigator.onLine) return silent || toast('인터넷 연결이 필요해요');
  try {
    const r = await getAggregateFromServer(fcol('photos'), { bytes: sum('size'), n: count() }), d = r.data();
    await setDoc(famRef(), { usage: { photoBytes: d.bytes || 0 } }, { merge: true });
    if (!silent) toast(`사진 ${d.n || 0}장 · ${mb(d.bytes || 0)}`);
  } catch (e) { if (!silent) fail(e); }
}
function openCleanup() {
  openM(`<h3>오래된 사진 정리</h3>
    <p class="sub">선택한 날짜 이전의 사진 원본을 먼저 백업(zip)으로 내려받고, 확인 후 서버에서 지워요. 기록과 작은 사진(썸네일)은 남아 있어요.</p>
    <div class="lbl">이 날짜까지의 사진</div><input id="cd" type="date" value="${addDays(today(), -365)}">
    <div class="row"><button class="btn ghost" data-act="mclose">취소</button><button class="btn" data-act="docleanup">백업하고 정리</button></div>`);
}
async function doCleanup(cut) {
  const recs = await backupRange('2000-01-01', cut, true, '정리전백업');
  if (!recs) return;
  const targets = recs.filter(r => (r.photos || []).some(p => !p.x));
  const cnt = targets.reduce((a, r) => a + r.photos.filter(p => !p.x).length, 0);
  if (!cnt) return toast('정리할 사진이 없어요');
  const bytes = targets.reduce((a, r) => a + r.photos.filter(p => !p.x).reduce((b, p) => b + p.size, 0), 0);
  const ok = await ask(`방금 내려받은 백업 파일을 안전한 곳에 저장했나요?\n사진 원본 ${cnt}장(약 ${mb(bytes)})을 서버에서 삭제해요.\n되돌릴 수 없어요.`, '삭제하기', true);
  if (!ok) return toast('정리를 취소했어요. 백업만 받아졌어요');
  try {
    let batch = writeBatch(db), n = 0, done = 0;
    for (const r of targets) {
      const nr = clone(r);
      for (const p of nr.photos) { if (p.x) continue; batch.delete(phRef(p.id)); p.x = 1; n++; done++; }
      const { id, ...body } = nr;
      batch.set(recRef(r.id), body); n++;
      if (n >= 400) { await batch.commit(); batch = writeBatch(db); n = 0; prog(`정리 중… ${done}/${cnt}`); }
    }
    if (n) await batch.commit();
  } catch (e) { prog(''); return fail(e); }
  prog('');
  await recount(true);
  toast(`사진 ${cnt}장을 정리했어요`);
}

/* =====================================================================
   16. 렌더링 · 라우팅
   ===================================================================== */
const routeParts = () => location.hash.replace(/^#\/?/, '').split('/');
const TABMAP = { '': 'home', cal: 'cal', sup: 'sup', mem: 'mem', more: 'more', log: 'more', set: 'more' };
const TITLES = { cal: '📅 캘린더', sup: '🛒 소모품 관리', mem: '🌸 봄이 추억', more: '☰ 더보기', log: '📋 기록 관리', set: '⚙️ 기준 설정' };
function render() {
  if (!BOOTED) return;
  const root = $('#app'), tabs = $('#tabs'), y = window.scrollY;
  $('#sync').textContent = navigator.onLine ? '' : '오프라인';
  $('#av').src = FAM ? avatar() : DEFAULT_AVATAR;
  if (!CODE || FAM_GONE || AUTH_ERR === 'auth') {
    if (FAM_GONE) { lsDel(KEY.code); CODE = ''; }
    tabs.style.display = 'none'; $('#ht').textContent = '🐶 캉캉 노트';
    root.innerHTML = viewSetup(); return;
  }
  if (!FAM) {
    tabs.style.display = 'none';
    root.innerHTML = AUTH_ERR === 'rules'
      ? `<div class="card"><h2>권한 오류</h2><p class="msg">Firestore 보안 규칙이 아직 설정되지 않았어요.\nFirebase 콘솔 → Firestore → 규칙에서 안내받은 규칙을 게시해 주세요.</p><button class="btn block" data-act="reload">다시 시도</button></div>`
      : `<div class="empty">불러오는 중…</div>`;
    return;
  }
  tabs.style.display = 'flex';
  const [r, a] = routeParts();
  let html;
  if (r === 'log') html = viewLog(LOG_TYPES.includes(a) ? a : (LOG_TYPES.includes(UI.log) ? UI.log : 'poop'));
  else if (r === 'set') html = viewSet();
  else if (r === 'cal') html = viewCal();
  else if (r === 'sup') html = viewSup();
  else if (r === 'mem') html = viewMem(a);
  else if (r === 'more') html = viewMore();
  else html = viewHome();
  root.innerHTML = html;
  $('#ht').textContent = TITLES[r] || `${(FAM.dog || {}).name || '캉캉'} 노트`;
  const tab = TABMAP[r] || 'home';
  tabs.querySelectorAll('a').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
  window.scrollTo(0, y);
}
function route(fresh) {
  if (MODALS.length) return;
  const key = routeParts().join('/');
  UI.route = location.hash || '#/'; saveUI();
  render();
  window.scrollTo(0, fresh ? (UI.scroll[key] || 0) : window.scrollY);
}
let scT = 0;
window.addEventListener('scroll', () => {
  clearTimeout(scT);
  scT = setTimeout(() => { UI.scroll[routeParts().join('/')] = window.scrollY; saveUI(); }, 400);
}, { passive: true });
window.addEventListener('online', () => { $('#sync').textContent = ''; });
window.addEventListener('offline', () => { $('#sync').textContent = '오프라인'; });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleRender(); else saveUI(); });
window.addEventListener('pagehide', saveUI);

/* =====================================================================
   17. 클릭 · 입력 처리
   ===================================================================== */

  mclose: () => closeM(),
  toastact: () => { if (TOAST_FN) { const f = TOAST_FN; TOAST_FN = null; $('#toast').style.display = 'none'; f(); } },

  create: createFamily,
  findfam: findFamily,
  joinas: t => joinAs(t.dataset.n),
  joinnew: () => joinAs($('#jn').value),
  copycode: () => { if (navigator.clipboard) navigator.clipboard.writeText(showCode(CODE)).then(() => toast('코드를 복사했어요'), () => toast(showCode(CODE))); },

  jscore: t => JUDGE && JUDGE.pick(t.dataset.v),

  openwalk: t => openWalk(t.dataset.id),
  /* 기록 */
  new: t => openForm(t.dataset.type, null, t.dataset.d ? { date: t.dataset.d } : undefined),

  save: submitForm,
  phadd: t => addPhoto(t.dataset.src),
  phdel: t => {

  photo: (t, e) => { e.stopPropagation(); openPhoto(t.dataset.rid, t.dataset.pid); },

  del: async (t, e) => {

  older: extendBack,
  /* 캘린더 */
  calmove: t => { CAL.m += +t.dataset.n; if (CAL.m < 0) { CAL.m = 11; CAL.y--; } if (CAL.m > 11) { CAL.m = 0; CAL.y++; } render(); },
  calday: t => openDay(t.dataset.d),

  buy: t => openBuy(t.dataset.id),
  buysave: t => saveBuy(t.dataset.id),
  /* 추억 · 친구 */
  opentrip: t => openTrip(t.dataset.id),
  friendnew: () => openFriend(),
  friendedit: t => openFriend(t.dataset.id),
  fsrc: async t => {
    const a = await acquire(t.dataset.src);

    try { FORM.photo = await smallPhoto(a.blob, a.crop); const i = $('#fpv'); i.src = FORM.photo; i.style.display = ''; } catch (e) { toast('사진을 처리하지 못했어요'); }
    prog('');
  },
  frsave: t => saveFriend(t.dataset.id),
  frdel: async t => { if (await ask('이 친구를 삭제할까요?', '삭제', true)) { FRS.delete(t.dataset.id); deleteDoc(frRef(t.dataset.id)).catch(fail); closeM(); scheduleRender(); } },
  /* 설정 */
  eprofile: openProfile,
  psave: () => {
    const n = $('#pn').value.trim(); if (!n) return toast('이름을 입력해 주세요');
    famSet({ dog: { name: n, breed: $('#pb').value.trim(), birthday: $('#pd').value } }); closeM(); toast('저장했어요');
  },
  avatar: openAvatarPick,
  avsrc: async t => {

  tadd: () => { if (!TABLE) return; const r = {}; TABLE.o.cols.forEach(c => r[c.k] = c.t === 'sel' ? c.opts[0][0] : c.t === 'num' ? 0 : ''); TABLE.rows.push(r); TABLE.draw(); },

  cleanup: openCleanup,
  docleanup: async () => { const c = $('#cd').value; if (!c) return toast('날짜를 입력해 주세요'); closeM(); await doCleanup(c); },

};
Object.entries(EDITORS).forEach(([k, f]) => ACTS[k] = f);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const f = ACTS[t.dataset.act];
  if (f) f(t, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (TABLE && t.dataset && t.dataset.k !== undefined && t.tagName === 'SELECT') TABLE.rows[+t.dataset.i][t.dataset.k] = t.value;
});
document.addEventListener('input', e => {
  const t = e.target;
  if (TABLE && t.dataset && t.dataset.k !== undefined && t.tagName === 'INPUT') TABLE.rows[+t.dataset.i][t.dataset.k] = t.value;
  if (t.dataset && t.dataset.money !== undefined) { const n = num(t.value); t.value = n ? n.toLocaleString('ko-KR') : ''; }
});
document.addEventListener('paste', e => { // PC에서 Ctrl+V 로 스크린샷 붙여넣기
  if (!FORM || !PHOTO_TYPES.includes(FORM.type)) return;
  const f = [...(e.clipboardData ? e.clipboardData.files : [])].find(x => x.type.startsWith('image/'));
  if (!f) return;
  e.preventDefault();
  cropPhoto(f).then(c => { if (c) addBlob(f, c); });
});

/* =====================================================================
   18. 시작
   ===================================================================== */
function authReady() {
  return new Promise((res, rej) => {
    const un = onAuthStateChanged(auth, u => {
      if (u) { un(); res(u); } else signInAnonymously(auth).catch(err => { un(); rej(err); });
    });
  });
}
async function boot() {
  if (!location.hash && UI.route) history.replaceState(null, '', UI.route);
  history.replaceState({ r: 'exit' }, '', location.href);
  history.pushState({ r: 'app' }, '', location.href);
  try { await authReady(); }
  catch (e) { console.error(e); AUTH_ERR = 'auth'; }
  BOOTED = true; window.__ready = true;
  if (CODE && !AUTH_ERR) startSync();
  render();
}
boot();

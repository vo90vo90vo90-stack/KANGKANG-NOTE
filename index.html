<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e08a3c">
<meta name="color-scheme" content="light dark">
<title>캉캉 노트</title>
<!--
  캉캉 노트 - 반려견 관리 (가족 공유) · 단일 HTML + Firebase(Firestore, 익명 로그인)

  [사용 방법]
  1) 이 파일을 HTTPS 주소에 올려서(Firebase Hosting 등) 가족 폰에서 엽니다.
  2) 처음 쓰는 사람: "가족 만들기" → 나온 가족 코드를 가족에게 알려줍니다.
     나머지 가족: "가족 코드로 참여" → 코드 입력 → 내 이름 선택.
  3) 화면은 홈(대시보드) / 관리(입력) / 기준(설정) 3개입니다.

  [백업 안내]
  - 사진은 줄여서 Firestore에 저장되고, 무료 한도(1GB)에 가까워지면 기준 화면의 백업 → 사진 정리를 쓰세요.
  - 백업 파일(.zip/.json)은 가족 폰이 아닌 곳(구글 드라이브 등)에도 보관하세요.
-->
<style>
/* ========== 테마 (CSS 변수 8개 + 보조색) ========== */
:root{--bg:#faf6f1;--c:#fff;--t:#2b2118;--s:#85766a;--p:#e08a3c;--ln:#eadfd3;--soft:#fdeedd;--g:#2f9e62;--r:#d64545;--o:#e0892a}
@media (prefers-color-scheme:dark){
 :root{--bg:#171310;--c:#221c17;--t:#f3ebe3;--s:#a99a8c;--p:#f0a050;--ln:#3a3029;--soft:#33271c;--g:#4cc58a;--r:#ff7070;--o:#f2a24a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 -apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* ========== 레이아웃 ========== */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ln);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:8px}
#ht{flex:1;font-weight:800;font-size:18px}
#sync{font-size:12px;color:var(--s);white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:12px 14px}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--c);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav#tabs a{flex:1;text-align:center;padding:9px 0 8px;font-size:12px;color:var(--s)}
nav#tabs a b{display:block;font-size:20px;line-height:1.2}
nav#tabs a.on{color:var(--p);font-weight:700}

/* ========== 카드·버튼·입력 ========== */
.card{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h2{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:400;color:var(--s);font-size:12px}
.sub{color:var(--s);font-size:13px}
.msg{margin:4px 0 14px;font-size:15px;white-space:pre-line}
.btn{border:0;background:var(--p);color:#fff;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--t)}
.btn.red{background:var(--r);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.block{display:block;width:100%;margin-top:8px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;margin-top:14px}
.row .btn{flex:1}
input,select,textarea{width:100%;border:1px solid var(--ln);background:var(--c);color:var(--t);border-radius:12px;padding:10px 12px;font:inherit;min-width:0}
textarea{min-height:70px;resize:vertical}
.lbl{font-size:13px;color:var(--s);margin:12px 0 5px}
.two{display:flex;gap:8px}
.two>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ln);background:var(--c);border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:700}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.ck{display:flex;gap:8px;align-items:center;margin-top:10px}
.ck input{width:auto}

/* ========== 의미 색 ========== */
.t-good{background:var(--g)}.t-warn{background:var(--o)}.t-bad{background:var(--r)}
.c-good{color:var(--g)}.c-warn{color:var(--o)}.c-bad{color:var(--r)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin:1px}
.tag{display:inline-block;font-size:12px;border-radius:10px;padding:1px 8px;background:var(--soft);color:var(--t)}
.tag.red{background:var(--r);color:#fff}.tag.orange{background:var(--o);color:#fff}.tag.green{background:var(--g);color:#fff}

/* ========== 홈 ========== */
.hero{display:flex;gap:12px;align-items:center;background:var(--soft)}
.hero .av{font-size:38px}
.hero .nm{font-size:20px;font-weight:800}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.quick button{border:1px solid var(--ln);background:var(--c);border-radius:14px;padding:10px 0;font-size:12px;cursor:pointer}
.quick button b{display:block;font-size:22px}
.banner{border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:14px;cursor:pointer}
.banner.red{background:var(--r);color:#fff}
.banner.orange{background:var(--o);color:#fff}
.big{font-size:28px;font-weight:800}
.week{display:flex;gap:4px}
.week .d{flex:1;text-align:center}
.week .stk{min-height:38px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start}
.week .lb{font-size:11px;color:var(--s)}
.week .lb.today{color:var(--p);font-weight:800}
.bars{display:flex;gap:6px;align-items:flex-end;height:84px;position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars .b i{display:block;width:70%;background:var(--p);border-radius:5px 5px 0 0;min-height:2px}
.bars .goal{position:absolute;left:0;right:0;border-top:1px dashed var(--s)}
.hbar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:3px}
.hbar i{display:block;height:100%;background:var(--p)}
.hbar.warn i{background:var(--o)}.hbar.bad i{background:var(--r)}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gal button{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--soft);cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;text-align:center}
.gal i{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;border:1.5px solid #fff}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}
.li:first-of-type{border-top:0}

/* ========== 기록 목록 ========== */
.dh{display:flex;justify-content:space-between;font-size:13px;color:var(--s);margin:14px 2px 6px}
.rec{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.rec .rt{display:flex;justify-content:space-between;gap:8px}
.rec .rt b{font-size:15px}
.rec .by{font-size:12px;color:var(--s);white-space:nowrap}
.rec .rs{font-size:13px;color:var(--s);margin-top:2px;word-break:break-word}
.th{width:62px;height:62px;object-fit:cover;border-radius:10px;margin:8px 6px 0 0;cursor:pointer;border:1px solid var(--ln)}
.rec .del{float:right;border:0;background:none;color:var(--r);font-size:13px;cursor:pointer;padding:2px 4px}
.flash{outline:2px solid var(--p)}

/* ========== 바텀시트 ========== */
.mbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.sheet h3{margin:0 0 6px;font-size:17px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.phs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ph{position:relative;width:76px;height:76px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--ln)}
.ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--r);color:#fff;cursor:pointer;line-height:1}
.pv img{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;background:#000}
.pv .sub{white-space:pre-line}
.scorebtn{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:1px solid var(--ln);background:var(--c);border-radius:12px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.scorebtn.on{border-color:var(--p);background:var(--soft);font-weight:700}
.scorebtn b{width:22px}
.trow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.trow .ro{min-width:24px;color:var(--s)}
.trow .x{border:0;background:none;color:var(--r);font-size:20px;cursor:pointer}

/* ========== 토스트·진행 ========== */
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:#222;color:#fff;border-radius:22px;padding:10px 16px;font-size:14px;max-width:88vw;display:none;text-align:center}
#prog{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center}
#prog div{background:var(--c);border-radius:16px;padding:20px 24px;text-align:center;max-width:80vw;white-space:pre-line}
.code{font-size:26px;font-weight:800;letter-spacing:2px;text-align:center;background:var(--soft);border-radius:14px;padding:14px;margin:10px 0;user-select:all}
.empty{color:var(--s);text-align:center;padding:22px 0;font-size:14px}
</style>
</head>

<nav id="tabs" style="display:none">

<script>
/* 시작 실패 안내: 앱이 뜨지 못하면 '불러오는 중'에서 멈추지 않고 원인을 보여줍니다. */
window.__fatal = function (msg) {
  var a = document.getElementById('app');
  if (!a) return;
  a.innerHTML = '<div class="card"><h2>⚠️ 앱을 시작하지 못했어요</h2><p class="msg"></p></div>';
  a.querySelector('.msg').textContent = msg;
};
window.addEventListener('error', function (e) { if (!window.__ready) window.__fatal('오류: ' + (e.message || e)); });
window.addEventListener('unhandledrejection', function (e) { if (!window.__ready) window.__fatal('오류: ' + ((e.reason && e.reason.message) || e.reason)); });
setTimeout(function () {
  if (!window.__ready) window.__fatal(location.protocol === 'file:'
    ? '파일을 직접 열면 동작하지 않아요.\nHTTPS 주소(웹 호스팅)에 올려서 그 주소로 열어야 해요.'
    : '10초가 지나도 시작되지 않았어요.\n인터넷 연결을 확인하고 새로고침해 주세요.');
}, 10000);
</script>

/* 모달: 열 때 pushState, 닫을 때 history.back() → 모바일 뒤로가기는 모달만 닫음 */
const MODALS = [];
let SKIP_POP = 0;
function openM(html, onClose) {
  const bg = document.createElement('div');
  bg.className = 'mbg';
  bg.innerHTML = `<div class="sheet">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeM(); });
  document.body.appendChild(bg);
  document.body.classList.add('lock');
  MODALS.push({ bg, onClose });
  history.pushState({ r: 'modal' }, '');
  return bg.querySelector('.sheet');
}
function closeM(viaPop) {
  const m = MODALS.pop();
  if (!m) return;
  m.bg.remove();
  if (!MODALS.length) document.body.classList.remove('lock');
  if (m.onClose) m.onClose();
  if (!viaPop) { SKIP_POP++; history.back(); }
  if (!MODALS.length && PENDING) { PENDING = false; scheduleRender(); }
}
function ask(msg, ok = '확인', danger = false) {
  return new Promise(res => {
    let done = false;
    const s = openM(`<p class="msg">${esc(msg)}</p><div class="row"><button class="btn ghost" data-a="no">취소</button><button class="btn ${danger ? 'red' : ''}" data-a="yes">${esc(ok)}</button></div>`,
      () => { if (!done) { done = true; res(false); } });
    s.addEventListener('click', e => {
      const a = e.target.dataset && e.target.dataset.a;
      if (!a) return;
      done = true; res(a === 'yes'); closeM();
    });
  });
}

/* 앱 종료 확인: 홈에서 뒤로가기를 누르면 '한 번 더' 안내 */
let exitArmed = false;
window.addEventListener('popstate', e => {
  if (SKIP_POP > 0) { SKIP_POP--; return; }
  if (MODALS.length) { closeM(true); return; }
  if (e.state && e.state.r === 'exit') {
    if (exitArmed) { history.back(); return; }
    exitArmed = true; toast('한 번 더 누르면 종료돼요');
    setTimeout(() => exitArmed = false, 2000);
    history.pushState({ r: 'app' }, '', location.hash || '#/');
  }
});

/* =====================================================================
   5. 사진 (축소 · 저장 · 삭제)
   ===================================================================== */
function loadImg(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), i = new Image();
    i.onload = () => { URL.revokeObjectURL(u); res(i); };
    i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('이미지를 읽지 못했어요')); };
    i.src = u;
  });
}
async function compress(file) {
  const img = await loadImg(file);
  const enc = (max, q) => {
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * k));
    c.height = Math.max(1, Math.round(img.height * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  };
  let max = 1000, q = 0.74, full = enc(max, q);
  while (full.length > PHOTO_MAX_CHARS && (q > 0.46 || max > 600)) {
    if (q > 0.5) q -= 0.08; else max -= 100;
    full = enc(max, q);
  }
  return { full, th: enc(200, 0.6) };
}
const addUsage = n => famSet({ usage: { photoBytes: increment(n) } });

/* 기록 + 사진 저장. 서버 응답을 기다리지 않아 오프라인에서도 바로 반영됩니다. */
function saveRec(rec, newPh, removeIds) {
  const old = RECS.get(rec.id);
  const oldPh = (old && old.photos) || [];
  const photos = oldPh.filter(p => !removeIds.includes(p.id));
  for (const f of newPh) {
    const pid = uid();
    photos.push({ id: pid, th: f.th, size: f.full.length });
    setDoc(phRef(pid), { data: f.full, rid: rec.id, size: f.full.length, date: rec.date }).catch(fail);
    addUsage(f.full.length);
  }
  for (const pid of removeIds) {
    const p = oldPh.find(x => x.id === pid);
    if (p && !p.x) { deleteDoc(phRef(pid)).catch(() => { }); addUsage(-p.size); }
  }
  rec.photos = photos;
  if (!photos.length) delete rec.photos;
  const clean = clone(rec);
  RECS.set(rec.id, clean);
  setDoc(recRef(rec.id), clean).catch(fail);
  if (rec.type === 'health' && rec.kind) {
    const cur = (FAM.last || {})[rec.kind] || '';
    if (rec.date > cur) famSet({ last: { [rec.kind]: rec.date } });
  }
}
async function recalcLast(kind) {
  try {
    const s = await getDocs(query(fcol('records'), where('kind', '==', kind)));
    let m = '';
    s.forEach(d => { const r = d.data(); if (r.type === 'health' && r.date > m) m = r.date; });
    famSet({ last: { [kind]: m } });
  } catch (e) { console.error(e); }
}
async function deleteRec(id) {
  const r = RECS.get(id);
  if (!r) return;
  for (const p of (r.photos || [])) {
    if (!p.x) { deleteDoc(phRef(p.id)).catch(() => { }); addUsage(-p.size); }
  }
  RECS.delete(id);
  deleteDoc(recRef(id)).catch(fail);
  if (r.type === 'health' && r.kind && (cfg().health.find(h => h.name === r.kind) || {}).days > 0) recalcLast(r.kind);
  scheduleRender();
}
function removePhoto(rid, pid) {
  const r = RECS.get(rid);
  if (!r) return;
  const p = (r.photos || []).find(x => x.id === pid);
  if (!p) return;
  const n = clone(r);
  n.photos = n.photos.filter(x => x.id !== pid);
  if (!n.photos.length) delete n.photos;
  if (!p.x) { deleteDoc(phRef(pid)).catch(() => { }); addUsage(-p.size); }
  RECS.set(rid, n);
  setDoc(recRef(rid), n).catch(fail);
  scheduleRender();
}

/* =====================================================================
   6. ZIP 만들기/읽기 (무압축 저장 방식 - 사진은 이미 압축된 JPEG)
   ===================================================================== */
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const u16 = n => [n & 255, (n >> 8) & 255];
const u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
function zipBuild(files) { // files: [{name, data:Uint8Array}] → Blob
  const enc = new TextEncoder(), parts = [], cen = [];
  let off = 0;
  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new Uint8Array([0x50, 0x4b, 3, 4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21),
      ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0)]);
    parts.push(lh, nm, f.data);
    cen.push(new Uint8Array([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21),
      ...u32(crc), ...u32(sz), ...u32(sz), ...u16(nm.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nm);
    off += lh.length + nm.length + sz;
  }
  let cdSize = 0;
  cen.forEach(c => cdSize += c.length);
  const end = new Uint8Array([0x50, 0x4b, 5, 6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(off), ...u16(0)]);
  return new Blob([...parts, ...cen, end], { type: 'application/zip' });
}
async function zipRead(file) {
  const size = file.size;
  const tail = new Uint8Array(await file.slice(Math.max(0, size - 65557), size).arrayBuffer());
  let p = -1;
  for (let i = tail.length - 22; i >= 0; i--) {
    if (tail[i] === 0x50 && tail[i + 1] === 0x4b && tail[i + 2] === 5 && tail[i + 3] === 6) { p = i; break; }
  }
  if (p < 0) throw new Error('zip 파일이 아니에요');
  const tv = new DataView(tail.buffer);
  const n = tv.getUint16(p + 10, true), cdSize = tv.getUint32(p + 12, true), cdOff = tv.getUint32(p + 16, true);
  const cdBuf = await file.slice(cdOff, cdOff + cdSize).arrayBuffer();
  const cd = new DataView(cdBuf), cdu = new Uint8Array(cdBuf), dec = new TextDecoder();
  const ent = new Map();
  let q = 0;
  for (let i = 0; i < n; i++) {
    const method = cd.getUint16(q + 10, true), csz = cd.getUint32(q + 20, true);
    const nl = cd.getUint16(q + 28, true), xl = cd.getUint16(q + 30, true), cl = cd.getUint16(q + 32, true);
    const lo = cd.getUint32(q + 42, true);
    ent.set(dec.decode(cdu.subarray(q + 46, q + 46 + nl)), { method, csz, lo });
    q += 46 + nl + xl + cl;
  }
  return {
    names: [...ent.keys()],
    async get(name) {
      const e = ent.get(name);
      if (!e) return null;
      if (e.method !== 0) throw new Error('압축된 zip은 지원하지 않아요');
      const lh = new DataView(await file.slice(e.lo, e.lo + 30).arrayBuffer());
      const start = e.lo + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
      return new Uint8Array(await file.slice(start, start + e.csz).arrayBuffer());
    }
  };
}
const dataUrlToU8 = d => {
  const b = atob(d.slice(d.indexOf(',') + 1)), u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u;
};
const u8ToDataUrl = u => new Promise(res => {
  const fr = new FileReader();
  fr.onload = () => res(fr.result);
  fr.readAsDataURL(new Blob([u], { type: 'image/jpeg' }));
});
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

/* =====================================================================
   7. 데이터 동기화 (Firestore 실시간 구독)

function applyChanges(snap, weightOnly) {
  snap.docChanges().forEach(ch => {
    const id = ch.doc.id;
    if (ch.type === 'removed') {
      const r = RECS.get(id);
      if (weightOnly && r && r.date >= WIN_FROM) return; // 최근 기간 구독이 계속 담당
      RECS.delete(id);
    } else RECS.set(id, { ...ch.doc.data(), id });
  });
  scheduleRender();
}
function startSync() {
  unsubs.forEach(f => f()); unsubs = [];
  FAM_GONE = false;
  unsubs.push(onSnapshot(famRef(), s => {
    if (s.exists()) { FAM = s.data(); }
    else if (!s.metadata.fromCache) { FAM = null; FAM_GONE = true; }
    scheduleRender();
  }, e => { console.error(e); AUTH_ERR = e.code === 'permission-denied' ? 'rules' : 'net'; scheduleRender(); }));
  WIN_FROM = addDays(today(), -WINDOW_DAYS);
  unsubs.push(onSnapshot(query(fcol('records'), where('date', '>=', WIN_FROM)), s => applyChanges(s, false), fail));
  unsubs.push(onSnapshot(query(fcol('records'), where('weight', '>', 0)), s => applyChanges(s, true), fail));
}
async function extendBack() {
  const to = addDays(WIN_FROM, -1);
  const from = addDays(WIN_FROM, -WINDOW_DAYS);
  prog('이전 기록 불러오는 중…');
  try {
    const s = await getDocs(query(fcol('records'), where('date', '>=', from), where('date', '<=', to)));
    s.forEach(d => RECS.set(d.id, { ...d.data(), id: d.id }));
    UI.olderTo = from; // 화면 표시용
    toast(`${s.size}건 불러왔어요`);
  } catch (e) { fail(e); }
  prog('');
  loadedBack = from; scheduleRender();
}
let loadedBack = '';

let RT = 0;
function scheduleRender() {
  clearTimeout(RT);
  RT = setTimeout(() => { if (MODALS.length) { PENDING = true; return; } render(); }, 120);
}

const scoreInfo = n => cfg().scores.find(s => +s.n === +n) || { n, label: n + '점', tone: 'warn' };
const colorTone = name => (cfg().colors.find(c => c.name === name) || { tone: 'good' }).tone;
const worst = (a, b) => TONE_RANK[a] >= TONE_RANK[b] ? a : b;
const poopTone = r => worst(scoreInfo(r.score).tone, r.color ? colorTone(r.color) : 'good');
const reactTone = (name) => {
  const l = cfg().reactions;
  if (name === l[l.length - 1]) return 'bad';
  if (name === l[0]) return 'good';
  return name === '거부' ? 'warn' : '';
};
function sumRec(r) {
  const T = TYPES[r.type];
  if (r.type === 'poop') {
    const si = scoreInfo(r.score);
    const flags = [r.amount, r.mucus ? '점액' : '', r.foreign ? '이물질' : '', r.memo].filter(Boolean).join(' · ');
    return [`<span class="dot t-${poopTone(r)}"></span>${esc(si.label)} · ${esc(r.color || '')}`, flags];
  }
  if (r.type === 'health') {
    return [`${esc(r.kind || '')}${r.weight ? ' ' + r.weight + 'kg' : ''}`, esc(r.memo || '')];
  }
  if (r.type === 'meal') {
    const rt = reactTone(r.reaction);
    return [`${esc(r.kind || '')} ${esc(r.name || '')}`.trim(),
      [r.amount, r.reaction ? `<span class="${rt ? 'c-' + rt : ''}">${esc(r.reaction)}</span>` : '', esc(r.memo || '')].filter(Boolean).join(' · ')];
  }
  if (r.type === 'walk') return [`${r.min}분${r.km ? ' · ' + r.km + 'km' : ''}`, esc(r.memo || '')];
  if (r.type === 'expense') return [`${esc(r.cat || '')} ${won(r.amount)}`, esc(r.memo || '')];
  return [esc((r.text || '').slice(0, 60)), ''];
}
function reminders() {
  const T = today(), out = [];
  for (const h of cfg().health) {
    if (!(+h.days > 0)) continue;
    const last = (FAM.last || {})[h.name];
    if (!last) { out.push({ name: h.name, rem: null }); continue; }
    const due = addDays(last, +h.days);
    out.push({ name: h.name, due, last, rem: diffDays(due, T) });
  }
  return out.filter(x => x.rem === null || x.rem <= 14).sort((a, b) => (a.rem ?? -999) - (b.rem ?? -999));
}
const dayLabel = rem => rem === null ? '기록 없음' : rem < 0 ? `D+${-rem} 지남` : rem === 0 ? '오늘' : `D-${rem}`;
const dayTone = rem => rem === null ? '' : rem < 0 ? 'red' : rem <= 7 ? 'orange' : '';

async function findFamily() {

function weightChart() {
  const c = cfg();
  const ws = [...RECS.values()].filter(r => r.weight > 0).sort(cmpAsc).slice(-12);
  if (!ws.length) return `<div class="empty">체중 기록이 없어요. 건강 → 체중으로 기록해 보세요</div>`;
  const last = ws[ws.length - 1];
  const head = `<div class="big">${last.weight}<small style="font-size:14px;font-weight:400">kg</small></div><div class="sub">${fmtD(last.date)} 기록${(c.target.wMin && c.target.wMax) ? ` · 적정 ${c.target.wMin}~${c.target.wMax}kg` : ''}</div>`;
  if (ws.length < 2) return head;
  const W = 300, H = 100, pl = 8, pr = 8, pt = 10, pb = 8;
  let lo = Math.min(...ws.map(r => r.weight)), hi = Math.max(...ws.map(r => r.weight));
  if (c.target.wMin && c.target.wMax) { lo = Math.min(lo, c.target.wMin); hi = Math.max(hi, c.target.wMax); }
  if (hi === lo) { hi += 1; lo -= 1; }
  const x = i => pl + (W - pl - pr) * i / (ws.length - 1);
  const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const pts = ws.map((r, i) => `${x(i).toFixed(1)},${y(r.weight).toFixed(1)}`).join(' ');
  const band = (c.target.wMin && c.target.wMax)
    ? `<rect x="0" y="${y(c.target.wMax).toFixed(1)}" width="${W}" height="${(y(c.target.wMin) - y(c.target.wMax)).toFixed(1)}" fill="var(--g)" opacity=".13"/>` : '';
  const dots = ws.map((r, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(r.weight).toFixed(1)}" r="3.5" fill="var(--p)"/>`).join('');
  return head + `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:6px">${band}<polyline points="${pts}" fill="none" stroke="var(--p)" stroke-width="2"/>${dots}</svg>
    <div class="sub" style="display:flex;justify-content:space-between"><span>${fmtD(ws[0].date)} ${ws[0].weight}kg</span><span>${fmtD(last.date)} ${last.weight}kg</span></div>`;
}

    h += `<div class="card"><div class="sub">이번 달 합계</div><div class="big">${won(t)}</div></div>`;
  }
  const poopsBy = {};
  if (type === 'meal') [...RECS.values()].filter(r => r.type === 'poop').forEach(r => (poopsBy[r.date] = poopsBy[r.date] || []).push(r));

      if (type === 'poop') note = `${same.length}회`;
      else if (type === 'walk') note = `${same.reduce((a, x) => a + num(x.min), 0)}분`;

    }
    body += recCard(r, extra);
  });
  h += body;

function openForm(type, id, preset) {

  const s = openM(`<h3>${TYPES[type].ic} ${TYPES[type].nm} ${old ? '수정' : '기록'}</h3>

    () => { FORM = null; });
  FORM = { type, id: old ? old.id : null, old, newPh: [], removed: [], sheet: s };
  if (!old) { // 임시저장 복원 (같은 종류의 새 기록 입력 중 앱이 닫힌 경우)
    try {
      const d = JSON.parse(lsGet(KEY.draft) || 'null');

  s.addEventListener('input', () => {

function collect(s) {
  const o = {};
  s.querySelectorAll('[name]').forEach(el => { o[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
  s.querySelectorAll('.chips[data-f]').forEach(ch => { const on = ch.querySelector('.on'); o[ch.dataset.f] = on ? on.dataset.v : ''; });
  return o;
}
function applyDraft(s, d) {
  s.querySelectorAll('[name]').forEach(el => {
    if (!(el.name in d) || el.name === 'date' || el.name === 'time') return;
    if (el.type === 'checkbox') el.checked = !!d[el.name]; else el.value = d[el.name];
  });
  s.querySelectorAll('.chips[data-f]').forEach(ch => {
    const f = ch.dataset.f;
    if (!(f in d)) return;
    ch.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === d[f]));
  });
}

  const { type, old, newPh, removed, sheet } = FORM;
  const o = collect(sheet);
  if (!o.date) return toast('날짜를 입력해 주세요');
  const rec = old ? clone(old) : { id: uid(), type, by: ME, at: Date.now() };
  rec.type = type; rec.date = o.date;
  if (o.time !== undefined) rec.time = o.time;
  if (type === 'poop') {
    if (!o.score) return toast('변 상태를 골라 주세요');
    Object.assign(rec, { score: +o.score, color: o.color || '', amount: o.amount || '', mucus: !!o.mucus, foreign: !!o.foreign, memo: o.memo.trim() });
  } else if (type === 'health') {
    if (!o.kind) return toast('항목을 골라 주세요');
    rec.kind = o.kind; rec.memo = o.memo.trim();
    const w = num(o.weight);
    if (w > 0) rec.weight = w; else delete rec.weight;
    if (o.kind === '체중' && !(w > 0)) return toast('체중을 입력해 주세요');
  } else if (type === 'meal') {
    Object.assign(rec, { kind: o.kind || '', name: o.name.trim(), amount: o.amount.trim(), reaction: o.reaction || '', memo: o.memo.trim() });
    if (!rec.name && !rec.memo) return toast('이름이나 메모를 입력해 주세요');
  } else if (type === 'walk') {
    const m = num(o.min);
    if (!(m > 0)) return toast('산책 시간(분)을 입력해 주세요');
    Object.assign(rec, { min: m, memo: o.memo.trim() });
    const km = num(o.km);
    if (km > 0) rec.km = km; else delete rec.km;
  } else if (type === 'expense') {
    const a = num(o.amount);
    if (!(a > 0)) return toast('금액을 입력해 주세요');
    Object.assign(rec, { cat: o.cat || '기타', amount: a, memo: o.memo.trim() });
  } else if (type === 'memo') {
    const keep = (rec.photos || []).filter(p => !removed.includes(p.id)).length + newPh.length;
    if (!o.text.trim() && !keep) return toast('내용이나 사진을 넣어 주세요');
    rec.text = o.text.trim();
  }
  if (old && old.by !== ME) rec.editedBy = ME;
  saveRec(rec, newPh, removed);
  lsDel(KEY.draft);
  UI.flash = rec.id; saveUI();
  closeM(); toast('저장했어요');
  setTimeout(() => { UI.flash = ''; }, 2200);
  scheduleRender();
}

const PART_LIMIT = 60 * 1048576;
async function backupRange(from, to, withPhotos, label) {
  if (!navigator.onLine) { toast('인터넷 연결이 필요해요'); return null; }
  prog('기록 불러오는 중…');
  let recs;
  try {
    const s = await getDocs(query(fcol('records'), where('date', '>=', from), where('date', '<=', to)));
    recs = s.docs.map(d => ({ ...d.data(), id: d.id })).sort(cmpAsc);
  } catch (e) { prog(''); fail(e); return null; }
  const stamp = today();
  const fam = { dog: FAM.dog, members: FAM.members, admin: FAM.admin };
  const head = { app: APP_ID, version: 1, exportedAt: new Date().toISOString(), range: [from, to], fam };
  if (!withPhotos) {
    download(new Blob([JSON.stringify({ ...head, records: recs })], { type: 'application/json' }), `캉캉노트_기록_${stamp}.json`);
    famSet({ lastBackup: stamp }); prog('');
    toast(`기록 ${recs.length}건을 내려받았어요 (사진 원본 제외)`);
    return recs;
  }
  const total = recs.reduce((a, r) => a + (r.photos || []).filter(p => !p.x).length, 0);
  let bucket = { files: [], recs: [], bytes: 0 }, part = 0, done = 0;
  const flush = async () => {
    if (!bucket.recs.length) return;
    part++;
    const json = new TextEncoder().encode(JSON.stringify({ ...head, part, records: bucket.recs }));
    const blob = zipBuild([{ name: 'data.json', data: json }, ...bucket.files]);
    download(blob, `캉캉노트_${label}_${stamp}_${part}.zip`);
    bucket = { files: [], recs: [], bytes: 0 };
    await sleep(900);
  };
  try {
    for (const r of recs) {
      for (const p of (r.photos || [])) {
        if (p.x) continue;
        prog(`사진 담는 중… ${++done}/${total}`);
        const d = await getDoc(phRef(p.id));
        if (d.exists()) {
          const u = dataUrlToU8(d.data().data);
          bucket.files.push({ name: `photos/${p.id}.jpg`, data: u });
          bucket.bytes += u.length;
        }
      }
      bucket.recs.push(r);
      if (bucket.bytes >= PART_LIMIT) await flush();
    }
    await flush();
  } catch (e) { prog(''); fail(e); return null; }
  famSet({ lastBackup: stamp }); prog('');
  toast(`백업 ${part}개 파일을 내려받았어요`);
  return recs;
}
function openBackup() {
  const to = today(), from = addDays(to, -365);
  openM(`<h3>백업 내려받기</h3>
    <div class="two"><div><div class="lbl">시작일</div><input id="bf" type="date" value="${from}"></div><div><div class="lbl">종료일</div><input id="bt" type="date" value="${to}"></div></div>

async function restoreFiles(files) {
  if (!navigator.onLine) return toast('인터넷 연결이 필요해요');
  let nRec = 0, nPh = 0;
  try {
    for (const f of files) {
      prog(`${f.name} 읽는 중…`);
      let data, zip = null;
      if (/\.json$/i.test(f.name)) data = JSON.parse(await f.text());
      else { zip = await zipRead(f); const j = await zip.get('data.json'); if (!j) throw new Error('data.json이 없어요'); data = JSON.parse(new TextDecoder().decode(j)); }
      if (data.app !== APP_ID) throw new Error('캉캉 노트 백업 파일이 아니에요');
      const recs = data.records || [];
      let batch = writeBatch(db), n = 0;
      for (const r of recs) {
        const { id, ...body } = r;
        batch.set(recRef(id), body); n++; nRec++;
        if (n >= 400) { await batch.commit(); batch = writeBatch(db); n = 0; prog(`기록 복구 ${nRec}건…`); }
      }
      if (n) await batch.commit();
      if (zip) {
        let pb = writeBatch(db), pn = 0;
        for (const name of zip.names.filter(x => x.startsWith('photos/'))) {
          const pid = name.slice(7).replace(/\.jpg$/, '');
          const owner = recs.find(r => (r.photos || []).some(p => p.id === pid));
          const u = await zip.get(name);
          const dataUrl = await u8ToDataUrl(u);
          pb.set(phRef(pid), { data: dataUrl, rid: owner ? owner.id : '', size: dataUrl.length, date: owner ? owner.date : '' });
          pn++; nPh++;
          if (pn >= 15) { await pb.commit(); pb = writeBatch(db); pn = 0; prog(`사진 복구 ${nPh}장…`); }
        }
        if (pn) await pb.commit();
      }
    }
  } catch (e) { prog(''); console.error(e); return toast('복구 실패: ' + (e.message || '파일을 확인해 주세요')); }
  prog('');
  await recount(true);
  toast(`복구 완료: 기록 ${nRec}건, 사진 ${nPh}장`);
}
async function recount(silent) {
  if (!navigator.onLine) return silent || toast('인터넷 연결이 필요해요');
  try {
    const r = await getAggregateFromServer(fcol('photos'), { bytes: sum('size'), n: count() });
    const d = r.data();
    await setDoc(famRef(), { usage: { photoBytes: d.bytes || 0 } }, { merge: true });
    if (!silent) toast(`사진 ${d.n || 0}장 · ${mb(d.bytes || 0)}`);
  } catch (e) { if (!silent) fail(e); }
}

async function doCleanup(cut) {
  const recs = await backupRange('2000-01-01', cut, true, '정리전백업');
  if (!recs) return;
  const targets = recs.filter(r => (r.photos || []).some(p => !p.x));
  const cnt = targets.reduce((a, r) => a + r.photos.filter(p => !p.x).length, 0);
  if (!cnt) return toast('정리할 사진이 없어요');
  const bytes = targets.reduce((a, r) => a + r.photos.filter(p => !p.x).reduce((b, p) => b + p.size, 0), 0);
  const ok = await ask(`방금 내려받은 백업 파일을 안전한 곳에 저장했나요?\n사진 원본 ${cnt}장(약 ${mb(bytes)})을 서버에서 삭제해요.\n되돌릴 수 없어요.`, '삭제하기', true);
  if (!ok) return toast('정리를 취소했어요. 백업만 받아졌어요');
  try {
    let batch = writeBatch(db), n = 0, done = 0;
    for (const r of targets) {
      const nr = clone(r);
      for (const p of nr.photos) {
        if (p.x) continue;
        batch.delete(phRef(p.id)); p.x = 1; n++; done++;
      }
      const { id, ...body } = nr;
      batch.set(recRef(r.id), body); n++;
      if (n >= 400) { await batch.commit(); batch = writeBatch(db); n = 0; prog(`정리 중… ${done}/${cnt}`); }
    }
    if (n) await batch.commit();
  } catch (e) { prog(''); return fail(e); }
  prog('');
  await recount(true);
  toast(`사진 ${cnt}장을 정리했어요`);
}

/* =====================================================================
   14. 렌더링 · 라우팅
   ===================================================================== */
const routeParts = () => location.hash.replace(/^#\/?/, '').split('/');
function render() {
  if (!BOOTED) return;
  const root = $('#app'), tabs = $('#tabs'), y = window.scrollY;
  $('#sync').textContent = navigator.onLine ? '' : '오프라인';
  if (!CODE || FAM_GONE || AUTH_ERR === 'auth') {
    if (FAM_GONE) { lsDel(KEY.code); CODE = ''; }
    tabs.style.display = 'none'; $('#ht').textContent = '🐶 캉캉 노트'; $('#ha').innerHTML = '';
    root.innerHTML = viewSetup(); return;
  }
  if (!FAM) {
    tabs.style.display = 'none';
    root.innerHTML = AUTH_ERR === 'rules'
      ? `<div class="card"><h2>권한 오류</h2><p class="msg">Firestore 보안 규칙이 아직 설정되지 않았어요.\nFirebase 콘솔 → Firestore → 규칙에서 안내받은 규칙을 게시해 주세요.</p><button class="btn block" data-act="reload">다시 시도</button></div>`
      : `<div class="empty">불러오는 중…</div>`;
    return;
  }
  tabs.style.display = 'flex';
  const [r, a] = routeParts();
  let html, tab, title, act = '';
  if (r === 'log') { const t = TYPES[a] ? a : (TYPES[UI.log] ? UI.log : 'poop'); html = viewLog(t); tab = 'log'; title = '기록 관리'; act = `<button class="btn sm" data-act="new" data-type="${t}">＋ ${TYPES[t].nm}</button>`; }
  else if (r === 'set') { html = viewSet(); tab = 'set'; title = '기준 설정'; }
  else { html = viewHome(); tab = 'home'; title = `🐶 ${(FAM.dog || {}).name || '캉캉 노트'}`; }
  root.innerHTML = html;
  $('#ht').textContent = title; $('#ha').innerHTML = act;
  tabs.querySelectorAll('a').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
  window.scrollTo(0, y);
}
function route(fresh) {
  if (MODALS.length) return;
  const key = routeParts().join('/');
  UI.route = location.hash || '#/'; saveUI();
  render();
  window.scrollTo(0, fresh ? (UI.scroll[key] || 0) : window.scrollY);
}
let scT = 0;
window.addEventListener('scroll', () => {
  clearTimeout(scT);
  scT = setTimeout(() => { UI.scroll[routeParts().join('/')] = window.scrollY; saveUI(); }, 400);
}, { passive: true });
window.addEventListener('online', () => { $('#sync').textContent = ''; });
window.addEventListener('offline', () => { $('#sync').textContent = '오프라인'; });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleRender(); else saveUI(); });
window.addEventListener('pagehide', saveUI);

/* =====================================================================
   15. 클릭 · 입력 처리
   ===================================================================== */
const ACTS = {
  reload: () => location.reload(),
  mclose: () => closeM(),
  smode: t => { SET.mode = t.dataset.m; SET.fam = null; render(); },
  create: createFamily,
  findfam: findFamily,
  joinas: t => joinAs(t.dataset.n),
  joinnew: () => joinAs($('#jn').value),
  copycode: () => { navigator.clipboard && navigator.clipboard.writeText(showCode(CODE)).then(() => toast('코드를 복사했어요'), () => toast(showCode(CODE))); },
  new: t => openForm(t.dataset.type),
  edit: t => openForm(RECS.get(t.dataset.id).type, t.dataset.id),
  remdone: t => openForm('health', null, { kind: t.dataset.kind }),
  gologs: t => { location.hash = '#/log/' + t.dataset.type; },
  gosettings: () => { location.hash = '#/set'; },
  chip: t => {
    const g = t.parentElement, on = t.classList.contains('on');
    g.querySelectorAll('.on').forEach(x => x.classList.remove('on'));
    if (!(on && g.dataset.opt)) t.classList.add('on');
  },
  save: submitForm,
  phadd: () => $('#pf').click(),
  phdel: t => {
    if (!FORM) return;
    if (t.dataset.pid) FORM.removed.push(t.dataset.pid);
    else FORM.newPh = FORM.newPh.filter(x => x.nid !== t.dataset.nid);
    t.parentElement.remove();
  },
  photo: (t, e) => { e.stopPropagation(); openPhoto(t.dataset.rid, t.dataset.pid); },
  phrm: async t => { if (await ask('이 사진을 삭제할까요?', '삭제', true)) { removePhoto(t.dataset.rid, t.dataset.pid); closeM(); toast('삭제했어요'); } },
  del: async (t, e) => {
    e.stopPropagation();
    const r = RECS.get(t.dataset.id); if (!r) return;
    const np = (r.photos || []).length;
    if (await ask(`이 ${TYPES[r.type].nm} 기록을 삭제할까요?${np ? `\n사진 ${np}장도 함께 삭제돼요.` : ''}`, '삭제', true)) { deleteRec(r.id); toast('삭제했어요'); }
  },
  older: extendBack,
  ftan: t => { FILTER.tan = t.checked; render(); },
  eprofile: openProfile,
  psave: () => {
    const n = $('#pn').value.trim(); if (!n) return toast('이름을 입력해 주세요');
    famSet({ dog: { name: n, breed: $('#pb').value.trim(), birthday: $('#pd').value } }); closeM(); toast('저장했어요');
  },
  etarget: openTarget,
  tgsave: () => {
    setCfg({ target: { poop: Math.max(1, Math.round(num($('#tp').value)) || 2), walkMin: Math.max(1, Math.round(num($('#tw').value)) || 60), wMin: num($('#tl').value), wMax: num($('#th2').value) } });
    closeM(); toast('저장했어요');
  },
  addmember: () => {
    openM(`<h3>가족 추가</h3><div class="lbl">이름</div><input id="mn" placeholder="예: 할머니"><div class="row"><button class="btn ghost" data-act="mclose">취소</button><button class="btn" data-act="msave">추가</button></div>`);
  },
  msave: () => {
    const n = $('#mn').value.trim(); if (!n) return toast('이름을 입력해 주세요');
    if ((FAM.members || []).includes(n)) return toast('이미 있는 이름이에요');
    famSet({ members: [...FAM.members, n] }); closeM();
  },
  rmmember: async t => { if (await ask(`${t.dataset.n}님을 가족 목록에서 뺄까요? (이 분의 기록은 남아요)`, '삭제', true)) famSet({ members: FAM.members.filter(m => m !== t.dataset.n) }); },
  mkadmin: async t => { if (await ask(`관리자를 ${t.dataset.n}님으로 바꿀까요?\n이후 나는 삭제와 기준 수정을 할 수 없어요.`, '변경')) famSet({ admin: t.dataset.n }); },
  switchme: () => {
    openM(`<h3>내 이름 선택</h3>${(FAM.members || []).map(m => `<button class="btn ghost block" data-act="setme" data-n="${esc(m)}">${esc(m)}${m === ME ? ' ✓' : ''}</button>`).join('')}`);
  },
  setme: t => { ME = t.dataset.n; lsSet(KEY.me, ME); closeM(); render(); toast(`${ME}(으)로 바꿨어요`); },
  tadd: () => { if (!TABLE) return; const r = {}; TABLE.o.cols.forEach(c => r[c.k] = c.t === 'sel' ? c.opts[0][0] : c.t === 'num' ? 0 : ''); TABLE.rows.push(r); TABLE.draw(); },
  tdel: t => { if (!TABLE) return; TABLE.rows.splice(+t.dataset.i, 1); TABLE.draw(); },
  tsave: () => { if (!TABLE) return; const { o, rows } = TABLE; o.save(rows); closeM(); toast('저장했어요'); },
  backup: openBackup,
  dobackup: async () => {
    const f = $('#bf').value, t = $('#bt').value, p = $('#bp').checked;
    if (!f || !t || f > t) return toast('기간을 확인해 주세요');
    closeM();
    await backupRange(f, t, p, '백업');
  },
  restore: () => $('#rf').click(),
  cleanup: openCleanup,
  docleanup: async () => { const c = $('#cd').value; if (!c) return toast('날짜를 입력해 주세요'); closeM(); await doCleanup(c); },
  recount: () => recount(false)
};
Object.entries(EDITORS).forEach(([k, f]) => ACTS[k] = f);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.tagName === 'INPUT' && t.type !== 'checkbox') return;
  if (t.type === 'checkbox') return;
  const f = ACTS[t.dataset.act];
  if (f) f(t, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'pf') pickPhotos(t);
  else if (t.id === 'rf') { const fs = [...t.files]; t.value = ''; if (fs.length) restoreFiles(fs); }
  else if (t.dataset && t.dataset.act === 'ftan') ACTS.ftan(t);
  else if (TABLE && t.dataset && t.dataset.k !== undefined && t.tagName === 'SELECT') TABLE.rows[+t.dataset.i][t.dataset.k] = t.value;
});
document.addEventListener('input', e => {
  const t = e.target;
  if (TABLE && t.dataset && t.dataset.k !== undefined && t.tagName === 'INPUT') TABLE.rows[+t.dataset.i][t.dataset.k] = t.value;
  if (t.name === 'amount' && FORM && FORM.type === 'expense') { // 금액 천 단위 콤마
    const n = num(t.value); t.value = n ? n.toLocaleString('ko-KR') : '';
  }
});

/* =====================================================================
   16. 시작
   ===================================================================== */
function authReady() {
  return new Promise((res, rej) => {
    const un = onAuthStateChanged(auth, u => {
      if (u) { un(); res(u); } else signInAnonymously(auth).catch(err => { un(); rej(err); });
    });
  });
}
async function boot() {
  // 뒤로가기 종료 확인용 기록 + 마지막 화면 복원
  if (!location.hash && UI.route) history.replaceState(null, '', UI.route);
  history.replaceState({ r: 'exit' }, '', location.href);
  history.pushState({ r: 'app' }, '', location.href);
  try { await authReady(); }
  catch (e) { console.error(e); AUTH_ERR = 'auth'; }
  BOOTED = true; window.__ready = true;
  if (CODE && !AUTH_ERR) startSync();
  render();
}
boot();
</script>

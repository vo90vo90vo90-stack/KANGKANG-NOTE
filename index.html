<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e08a3c">
<meta name="color-scheme" content="light dark">
<title>캉캉 노트</title>
<!--
  캉캉 노트 - 반려견(봄이) 관리 · 가족 공유 · 단일 HTML + Firebase(Firestore, 익명 로그인)

  [사용 방법]
  1) HTTPS 주소(GitHub Pages 등)에 올려서 가족 폰에서 엽니다. 파일을 직접 열면 동작하지 않아요.
  2) 처음 쓰는 사람: "가족 만들기" → 가족 코드를 가족에게 알려줍니다. 나머지 가족: "가족 코드로 참여".
  3) 하단 탭: 홈 / 캘린더 / 소모품 / 추억 / 더보기(기록 관리·기준 설정·백업)

  [산책 지도 안내]
  - 산책 중에는 앱 화면을 켜 둬야 GPS 경로가 끊기지 않아요(화면이 꺼지지 않게 자동 유지).
  - 지도는 배경 없이 경로만 그려서 가벼워요.

  [백업 안내]
  - 사진은 줄여서 Firestore에 저장돼요(무료 1GB). 가득 차기 전에 기준 → 백업 → 사진 정리를 쓰세요.
-->
<style>
/* ========== 테마 (CSS 변수) ========== */
:root{--bg:#fdf8f3;--c:#fff;--t:#4a3a30;--s:#8c7b70;--p:#f4aa92;--pd:#d9734f;--pt:#5a3426;--ln:#f1e5db;--soft:#fdebe0;--g:#9ad7b6;--r:#f4a3a3;--o:#f8cf9f;--gt:#1f4d36;--rt:#5a2a26;--ot:#5a3a1c}
@media (prefers-color-scheme:dark){
 :root{--bg:#1f1b22;--c:#2a252e;--t:#f5ecee;--s:#b9aeb4;--p:#f4aa92;--pd:#f4aa92;--pt:#4a2a1c;--ln:#3d3641;--soft:#3a3139;--g:#8fd0ae;--r:#f4a3a3;--o:#f8cf9f;--gt:#1f4d36;--rt:#5a2a26;--ot:#5a3a1c}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{word-break:keep-all;overflow-wrap:break-word;margin:0;background:var(--bg);color:var(--t);font:17px/1.5 -apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;padding-bottom:calc(122px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* ========== 레이아웃 ========== */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ln);padding:calc(5px + env(safe-area-inset-top)) 14px 5px;display:flex;align-items:center;gap:10px}
#av{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--p);cursor:pointer;background:var(--soft)}
#ht{flex:0 1 auto;max-width:60%;font-weight:700;font-size:15px;line-height:1.25;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sync{font-size:13px;color:var(--s);margin-left:auto}
#mem{flex:none}
#mem .mc{width:34px;height:34px;border-radius:50%;border:2px solid var(--p);object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--t);font-weight:800;line-height:1;overflow:hidden;white-space:nowrap;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:14px}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--c);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav#tabs a{flex:1 1 0;min-width:0;text-align:center;padding:5px 0 3px;font-size:13px;color:var(--s);white-space:nowrap}
nav#tabs a b{display:block;margin:0 2px 1px;padding:3px 0;line-height:1}
nav#tabs a.on{color:var(--pd);font-weight:800}
nav#tabs a.on b{background:var(--soft);border-radius:16px}

/* ========== 카드·버튼·입력 ========== */
.card{background:var(--c);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h2{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:400;color:var(--s);font-size:13px}
.sub{color:var(--s);font-size:14px}
.msg{margin:4px 0 14px;font-size:17px;white-space:pre-line}
.btn{border:0;background:var(--p);color:var(--pt);border-radius:14px;padding:14px 18px;min-height:52px;font-weight:800;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--t)}
.btn.red{background:var(--r);color:var(--rt)}
.btn.sm{padding:8px 14px;min-height:40px;font-size:15px}
.btn.block{display:block;width:100%;margin-top:10px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;margin-top:16px}
.row .btn{flex:1}
input,select,textarea{width:100%;border:1px solid var(--ln);background:var(--c);color:var(--t);border-radius:14px;padding:13px 14px;font:inherit;min-width:0}
textarea{min-height:84px;resize:vertical}
.lbl{font-size:14px;color:var(--s);margin:14px 0 6px}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ln);background:var(--c);border-radius:24px;padding:9px 16px;font-size:16px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--p);border-color:var(--p);color:var(--pt);font-weight:800}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.ck{display:flex;gap:10px;align-items:center;margin-top:12px}.ck input{width:22px;height:22px}
.bigrow{display:flex;align-items:center;gap:14px;width:100%;border:1px solid var(--ln);background:var(--c);border-radius:18px;padding:20px 18px;font-size:19px;font-weight:700;margin-bottom:12px;cursor:pointer;text-align:left}
.bigrow b{font-size:30px}

/* ========== 의미 색 ========== */
.t-good{background:var(--g)}.t-warn{background:var(--o)}.t-bad{background:var(--r)}.t-pend{background:var(--s)}
.c-good{color:var(--g)}.c-warn{color:var(--o)}.c-bad{color:var(--r)}
.dot{display:inline-block;width:15px;height:15px;border-radius:50%;margin:1px;vertical-align:middle}
.tag{display:inline-block;white-space:nowrap;flex:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;font-size:13px;border-radius:10px;padding:2px 9px;background:var(--soft);color:var(--t)}
.tag.red{background:var(--r);color:var(--rt)}.tag.orange{background:var(--o);color:var(--ot)}.tag.green{background:var(--g);color:var(--gt)}

/* ========== 홈 ========== */
.hero{display:flex;gap:14px;align-items:center;background:var(--soft)}
.avbig{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--p);flex:none}
.hero .nm{font-size:24px;font-weight:800}
.banner{border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:17px;font-weight:700;cursor:pointer}
.banner small{font-weight:400;font-size:14px;opacity:.95}
.banner.red{background:var(--r);color:var(--rt)}.banner.orange{background:var(--o);color:var(--ot)}.banner.green{background:var(--g);color:var(--gt)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.act{border:0;border-radius:24px;min-height:140px;font-size:23px;font-weight:800;color:#4a3a30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:8px}
.act b{font-size:46px;line-height:1.1}
.act small{font-size:14px;font-weight:600;opacity:.75}
.wi,.ic{height:1.3em;width:1.3em;object-fit:contain;vertical-align:-.3em}
.ti{width:min(60px,14.4vw);height:auto;aspect-ratio:1;display:block;margin:0 auto}
.bi{width:68px;height:68px;display:block;margin:0 auto 2px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 3px 8px rgba(120,90,70,.18)}
.wmvw{position:relative;display:block;width:84px;height:66px;margin:0 auto}
.wmvw i{position:absolute;left:0;height:4px;border-radius:2px;background:rgba(160,110,90,.45);animation:spd .45s linear infinite}
.wmvw i:nth-child(1){top:20px;width:16px}.wmvw i:nth-child(2){top:33px;width:22px;animation-delay:.15s}.wmvw i:nth-child(3){top:46px;width:14px;animation-delay:.3s}
@keyframes spd{from{transform:translateX(8px);opacity:0}30%{opacity:1}to{transform:translateX(-6px);opacity:0}}
.wimg.wmv{position:absolute;left:8px;top:0;width:68px;height:68px;margin:0;transform-origin:50% 90%;animation:trot .42s ease-in-out infinite}
@keyframes trot{0%,100%{transform:translateY(0) rotate(-7deg)}25%{transform:translateY(-7px) rotate(0)}50%{transform:translateY(0) rotate(7deg)}75%{transform:translateY(-7px) rotate(0)}}
@media (prefers-reduced-motion:reduce){.wimg.wmv,.wmvw i{animation:none}}
.wimg{width:68px;height:68px;object-fit:contain;display:block;margin:0 auto;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 3px 8px rgba(120,90,70,.18)}
#walklbl{white-space:nowrap;font-size:20px}
.a-poop{background:#e6d9f4}.a-walk{background:#f9eab0}.a-walk.on{background:#f8bdb4}.a-walk.other{background:#e2dcd6}
.a-meal{background:#d3e8f7}.a-snack{background:#fde5c4}
.sr{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--ln);font-size:18px}
.sr:first-child{border-top:0}
.sr span{flex:1;white-space:nowrap}.sr b{font-size:20px}.sr small{color:var(--s);font-size:13px;text-align:right;white-space:nowrap}
.sr button{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:var(--c);font-size:22px;cursor:pointer}
.big{font-size:30px;font-weight:800}
.week{display:flex;gap:4px;align-items:stretch}.week .d{flex:1;text-align:center;display:flex;flex-direction:column}
.week .stk{flex:1;min-height:92px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;padding-bottom:4px}
.week .lb{font-size:12px;color:var(--s)}.week .lb.today{color:var(--pd);font-weight:800}
.hbar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:4px}
.hbar i{display:block;height:100%;background:var(--p)}
.hbar.warn i{background:var(--o)}.hbar.bad i{background:var(--r)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal button{position:relative;border:0;padding:0;border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--soft);cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;text-align:center}
.gal i{position:absolute;top:5px;right:5px;width:12px;height:12px;border-radius:50%;border:2px solid #fff}
main,.mbg,.card{overflow-wrap:anywhere}
.li>*,.rec>*,.sr>*,.frow>*{min-width:0}
.li>*:not(:first-child){flex:none;max-width:62%}
.mrow{padding:12px 0;border-top:1px solid var(--ln)}.mrow:first-of-type{border-top:0}
.mtop{display:flex;align-items:center;gap:12px;min-width:0}
.mname{min-width:0;flex:1}.mn1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.mn1 b{font-size:18px;overflow-wrap:anywhere}
.mbtn{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.mbtn .btn{margin:0}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--ln)}
.li:first-of-type{border-top:0}
.map{width:100%;aspect-ratio:1;border-radius:16px;background:var(--soft);display:block}
.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pagehead h1{margin:0;font-size:22px}

/* ========== 캘린더 ========== */
.cal{--ch:clamp(52px,calc((100dvh - 372px) / 6),112px)}
.cal .wd{text-align:center;font-size:14px;color:var(--s);padding:4px 0}
.cal .wh{display:grid;grid-template-columns:repeat(7,1fr)}
.wk{position:relative;margin-top:2px}
.wkg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cd{position:relative;min-height:calc(var(--ch) + var(--lanes,0) * 15px);border:1px solid var(--ln);background:var(--c);border-radius:8px;padding:2px 1px 3px;padding-top:calc(24px + var(--lanes,0) * 15px);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer;font-size:15px}
.cd>span:first-child{position:absolute;top:2px;left:0;right:0;text-align:center;line-height:20px}
.cd.today{border:2px solid var(--p)}.cd.today>span:first-child{font-weight:800;color:var(--pd)}.cd.out{opacity:.2;pointer-events:none}.cd.sun{color:var(--r)}
.cd .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:2px}
.cd .dots i,.lg i{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--k)}
.lg i{width:11px;height:11px}
.cd .dots i.ring,.lg i.ring{background:transparent;border:2px solid var(--k)}
.wkb{position:absolute;left:0;right:0;top:0;height:0;pointer-events:none}
.tbar{position:absolute;height:14px;background:#f4a6c8;color:#5a2a40;border:0;padding:0 5px;font-size:10.5px;line-height:14px;font-weight:700;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:auto;cursor:pointer;border-radius:3px}
.tbar.cs{border-top-left-radius:8px;border-bottom-left-radius:8px}.tbar.ce{border-top-right-radius:8px;border-bottom-right-radius:8px}
.lg .bar{display:inline-block;width:22px;height:9px;border-radius:5px;background:#f4a6c8;margin-right:4px}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--s);margin:10px 2px}
.lg span{display:flex;align-items:center;gap:5px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mnav b{font-size:21px}.mnav button{width:48px;height:38px;border-radius:14px;border:1px solid var(--ln);background:var(--c);font-size:22px;cursor:pointer}

/* ========== 목록·카드 ========== */
.dh{display:flex;justify-content:space-between;font-size:14px;color:var(--s);margin:16px 2px 8px}
.rec{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.rec .rt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rec .rt b{font-size:17px}
.rec .by{font-size:13px;color:var(--s);white-space:nowrap}
.rec .rs{font-size:15px;color:var(--s);margin-top:3px;word-break:break-word}
.th{width:72px;height:72px;object-fit:cover;border-radius:12px;margin:8px 6px 0 0;cursor:pointer;border:1px solid var(--ln)}
.rec{display:flow-root}
.rec .del{display:inline-block;margin:-4px -6px -4px 10px;border:1px solid var(--ln);border-radius:8px;background:none;color:var(--r);font-size:12.5px;cursor:pointer;padding:3px 9px;vertical-align:middle}
.flash{outline:2.5px solid var(--p)}
.trip{padding:0;overflow:hidden}
.trip .cv{width:100%;height:190px;object-fit:cover;display:block;background:var(--soft)}
.trip .tb{padding:14px}
.flist{max-height:244px;overflow-y:auto;border-top:1px solid var(--ln);-webkit-overflow-scrolling:touch}
.frow{display:flex;align-items:center;gap:10px;height:61px;border-bottom:1px solid var(--ln);cursor:pointer;overflow:hidden}
.frow img,.frow .noimg,.mph,.mph.no{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--p);flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--soft)}
.frow b{font-size:17px;flex:none;max-width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fsub{font-size:13px;color:var(--s);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .tag{flex:none;max-width:38%}
.btn.sm{white-space:nowrap}
button.mph{padding:0;cursor:pointer}
.fr{background:var(--c);border:1px solid var(--ln);border-radius:18px;padding:16px 10px;text-align:center;cursor:pointer}
.fr img,.fr .noimg{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--p);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--soft)}
.fr b{font-size:19px;display:block}
.sup{border-left:6px solid var(--ln)}
.sup.late{border-left-color:var(--r)}.sup.soon{border-left-color:var(--o)}

/* ========== 바텀시트 ========== */
.mbg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.sheet h3{margin:0 0 8px;font-size:20px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.phs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ph{position:relative;width:84px;height:84px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid var(--ln)}
.ph button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--r);color:#fff;cursor:pointer;line-height:1;font-size:16px}
.src{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.src button{border:1.5px solid var(--ln);background:var(--c);border-radius:16px;padding:12px 4px;font-size:14px;font-weight:700;cursor:pointer}
.src button b{display:block;font-size:28px}
.pv img{width:100%;max-height:62vh;object-fit:contain;border-radius:14px;background:#000}
.pv .sub{white-space:pre-line;margin-top:8px}
.scorebtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid var(--ln);background:var(--c);border-radius:16px;padding:14px;margin-bottom:8px;cursor:pointer;font-size:18px}
.scorebtn.on{border-color:var(--p);background:var(--soft);font-weight:800}
.scorebtn b{width:24px;font-size:20px}
.trow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.trow .ro{min-width:26px;color:var(--s)}
.trow .x{border:0;background:none;color:var(--r);font-size:26px;cursor:pointer}
.crop{position:relative;overflow:hidden;border-radius:12px;background:#000}
.crop img{width:100%;display:block}
.cm{position:absolute;left:0;right:0;background:rgba(0,0,0,.62)}
.cm.top{top:0;border-bottom:2px solid var(--p)}.cm.bot{bottom:0;border-top:2px solid var(--p)}
input[type=range]{padding:0;height:34px;accent-color:var(--p)}

/* ========== 토스트·진행 ========== */
#toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:#222;color:#fff;border-radius:24px;padding:12px 18px;font-size:16px;max-width:92vw;display:none;text-align:center}
#toast button{margin-left:12px;background:none;border:0;color:#ffd27a;font-weight:800;font-size:16px;cursor:pointer}
#prog{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center}
#prog div{background:var(--c);border-radius:18px;padding:22px 26px;text-align:center;max-width:80vw;white-space:pre-line;font-size:17px}
.code{font-size:28px;font-weight:800;letter-spacing:2px;text-align:center;background:var(--soft);border-radius:16px;padding:16px;margin:10px 0;user-select:all}
.empty{color:var(--s);text-align:center;padding:24px 0;font-size:16px}
.act small,.banner,.sub,.rs,#toast span{text-wrap:balance}
#toast{width:max-content}
.li>div:first-child{min-width:0}
#bub.bday{background:linear-gradient(135deg,#fff1f7,#ffe3f0 55%,#fff4c9);color:#c2185b;border:2px solid #ff9ec8;box-shadow:0 4px 16px rgba(255,126,182,.55)}
#bub.bday::before{border-right-color:#fff1f7}
#bub{position:fixed;z-index:60;top:4px;left:50%;right:10px;background:#fff;color:#2b2118;border-radius:14px;padding:7px 11px;font-size:13.5px;font-weight:700;line-height:1.35;box-shadow:0 3px 12px rgba(0,0,0,.28);white-space:pre-line;word-break:keep-all}
#bub::before{content:'';position:absolute;left:-7px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right:9px solid #fff}
#bub.in{animation:bubin .25s ease-out}
@keyframes bubin{from{opacity:0;transform:translateX(-6px) scale(.92)}to{opacity:1;transform:none}}
#av.happy{animation:hop .9s ease-in-out}
@keyframes hop{0%,100%{transform:none}15%{transform:translateY(-7px) rotate(-12deg)}30%{transform:translateY(0)}45%{transform:translateY(-7px) rotate(12deg)}60%{transform:translateY(0)}75%{transform:translateY(-4px) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){#av.happy,#bub.in{animation:none}}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{position:relative}
.sbtn{width:100%;border:0;border-radius:18px;min-height:84px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#4a3a30;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.sbtn .sn{font-size:19px;font-weight:800;white-space:nowrap}
.sbtn .sc{font-size:16px;font-weight:700;opacity:.85}.sbtn .sc b{font-size:22px}
.sbtn.done{box-shadow:inset 0 0 0 3px #7fc79c}
.sw .sm{position:absolute;bottom:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.75);color:#4a3a30;font-size:20px;line-height:1;cursor:pointer}

/* ========== v4 추가 ========== */
.aw{position:relative}.aw .act{width:100%;height:100%}
.act .cnt{font-size:16px;font-weight:700;opacity:.9;margin-top:2px}.act .cnt i{font-style:normal;font-size:25px;font-weight:800}
.act.done{box-shadow:inset 0 0 0 3px #7fc79c}
.aw .am{position:absolute;right:9px;top:9px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.8);color:#4a3a30;font-size:24px;line-height:1;cursor:pointer}
.tag.dd{font-size:15px;font-weight:800;padding:4px 12px;align-self:flex-start;max-width:none;overflow:visible}
.pchip{border:0;font:inherit;font-size:14px;font-weight:800;padding:7px 13px;border-radius:14px;cursor:pointer}
.gal.sm{grid-template-columns:repeat(4,1fr);gap:6px}.gal.sm span{font-size:10px}
.jhead{display:flex;gap:12px;align-items:center;margin:10px 0 4px}
.jph{width:88px;height:88px;flex:none;border:0;padding:0;border-radius:14px;overflow:hidden;position:relative;background:var(--soft);cursor:pointer}
.jph img{width:100%;height:100%;object-fit:cover;display:block}
.jph span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;text-align:center;padding:1px 0}
.jbig .scorebtn{min-height:62px;font-size:19px}
.jbig .chip{padding:12px 18px;font-size:18px}
.jbig .btn{min-height:56px;font-size:19px}
.hbtn{width:100%;min-height:56px;margin-top:12px;border:1.5px solid var(--ln);background:var(--soft);border-radius:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px;font-size:17px;cursor:pointer;text-align:left}
.hbtn .chev{color:var(--pd);font-weight:800;white-space:nowrap}
.bhist{margin-top:6px}
.bh{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--ln)}
.bh:last-child{border-bottom:0}
.bh .del{margin-top:4px;border:1px solid var(--ln);border-radius:8px;background:none;color:var(--r);font-size:12.5px;padding:3px 9px;cursor:pointer}
.sch{border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:10px}
.chip.sm{padding:7px 13px;font-size:14px}
.seg{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:16px;margin-bottom:12px}
.seg button{flex:1;border:0;border-radius:12px;padding:12px 4px;font-size:16px;font-weight:700;background:transparent;cursor:pointer;color:var(--s)}
.seg button.on{background:var(--c);color:var(--pd);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.dnav{position:sticky;top:calc(47px + env(safe-area-inset-top));z-index:6;background:var(--bg);display:flex;gap:8px;align-items:stretch;padding:6px 0;margin-bottom:6px}
.dnav>button{width:64px;min-height:60px;border-radius:16px;border:1.5px solid var(--ln);background:var(--c);font-size:26px;cursor:pointer;color:var(--pd)}
.dnav>button:disabled{opacity:.35}
.dpick{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid var(--ln);border-radius:16px;background:var(--c);cursor:pointer;padding:4px}
.dpick b{font-size:19px}.dpick span{font-size:12.5px;color:var(--s)}
.dt.bad{border-color:var(--r,#e53935)!important;background:#fff3f2}
.dpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0;border:0}
.dsum{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:12px 14px;margin:6px 0 10px;font-size:16px}
.dsum span{color:var(--pd);font-weight:700;text-align:right}
.fres{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 0;font-weight:700}
.fres .lk{border:0;background:none;color:var(--pd);font-size:14px;font-weight:700;cursor:pointer;padding:6px}

/* ========== v5 추가 ========== */
.wfw{position:relative;display:block;width:92px;height:92px;margin:0 auto 2px;animation:wbob 1.9s ease-in-out infinite}
.wfr{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 3px 8px rgba(120,90,70,.18)}
.wfr:nth-child(2){opacity:0;transition:opacity 1.1s ease-in-out}.wfr:nth-child(2).on{opacity:1}
@keyframes wbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@media (prefers-reduced-motion:reduce){.wfw{animation:none}}
.srow{display:flex;gap:8px;align-items:center;margin-bottom:2px}.srow .btn{flex:none;width:auto;padding:10px 14px}
.mini{border:1px solid var(--ln);border-radius:8px;background:none;color:var(--r);font-size:13px;padding:5px 11px;cursor:pointer}
.mini.ed{color:var(--pd)}
.mbt{display:inline-flex;gap:6px;margin-top:4px}
.rec .del.ed{color:var(--pd);margin-right:0}
.mm{border-top:1px solid var(--ln);padding:10px 0 4px;margin-top:10px}
.lg2{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--s);margin-top:6px}
.lg2 .dot{width:10px;height:10px}
.card h2>span{text-align:left}
.li .mbt{margin:0 0 0 8px;flex:none}
.codebox{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 10px;font-size:13px}
.code.sm{font-size:14px;letter-spacing:1.5px;padding:0;background:none;border:0;margin:0;font-weight:700;color:var(--s)}
</style>
</head>

function weightChart() {

  if (!ws.length) return `<div class="empty">체중 기록이 없어요. 기록 관리 → 건강 → 체중으로 남겨 보세요</div>`;
  const last = ws[ws.length - 1];
  const head = `<div class="big">${last.weight}<small style="font-size:15px;font-weight:400">kg</small></div><div class="sub">${fmtD(last.date)} 기록${(c.target.wMin && c.target.wMax) ? ` · 적정 ${c.target.wMin}~${c.target.wMax}kg` : ''}</div>`;
  if (ws.length < 2) return head;
  const W = 300, H = 100, pl = 8, pr = 8, pt = 10, pb = 8;
  let lo = Math.min(...ws.map(r => r.weight)), hi = Math.max(...ws.map(r => r.weight));
  if (c.target.wMin && c.target.wMax) { lo = Math.min(lo, c.target.wMin); hi = Math.max(hi, c.target.wMax); }
  if (hi === lo) { hi += 1; lo -= 1; }
  const x = i => pl + (W - pl - pr) * i / (ws.length - 1), y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const pts = ws.map((r, i) => `${x(i).toFixed(1)},${y(r.weight).toFixed(1)}`).join(' ');
  const band = (c.target.wMin && c.target.wMax) ? `<rect x="0" y="${y(c.target.wMax).toFixed(1)}" width="${W}" height="${(y(c.target.wMin) - y(c.target.wMax)).toFixed(1)}" fill="var(--g)" opacity=".13"/>` : '';
  const dots = ws.map((r, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(r.weight).toFixed(1)}" r="3.5" fill="var(--p)"/>`).join('');
  return head + `<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:6px">${band}<polyline points="${pts}" fill="none" stroke="var(--p)" stroke-width="2"/>${dots}</svg>`;

function hay(r) {
  const p = [];
  for (const [k, v] of Object.entries(r)) { if (['id', 'photos', 'at', 'type', 'editedBy', 'judgedBy', 'startAt', 'endAt', 'sid'].includes(k) || v == null || typeof v === 'object') continue; p.push(String(v)); }
  if (r.type === 'poop') p.push(isPending(r) ? '입력 대기 미입력' : scoreInfo(r.score).label);
  if (r.type === 'meal') p.push(r.kind === '간식' ? '간식' : '식사');
  if (r.type === 'walk' && r.min) p.push(r.min + '분');

  return p.join(' ').toLowerCase();
}
function dayNote(type, same) {
  if (type === 'poop') return `${same.length}회`;
  if (type === 'walk') return `${same.length}회 · ${same.reduce((a, x) => a + num(x.min), 0)}분`;
  if (type === 'supp') { const m = {}; same.forEach(x => m[x.name] = (m[x.name] || 0) + 1); return Object.entries(m).map(([k, v]) => `${esc(k)} ${v}`).join(' · '); }
  if (type === 'meal') return `식사 ${same.filter(x => x.kind !== '간식').length} · 간식 ${same.filter(x => x.kind === '간식').length}`;
  if (type === 'expense') return won(same.reduce((a, x) => a + num(x.amount), 0));
  if (type === 'health') { const t = same.reduce((a, x) => a + num(x.amount), 0); return t > 0 ? won(t) : `${same.length}건`; }
  return `${same.length}건`;
}
function logList(type) {
  const toks = LOG.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return [...RECS.values()].filter(r => {
    if (r.type !== type) return false;
    if (LOG.from && r.date < LOG.from) return false;
    if (LOG.to && r.date > LOG.to) return false;
    if (!toks.length) return true;
    const t = hay(r);
    return toks.every(k => t.includes(k));
  }).sort(cmpDesc);
}

  const by = {}; list.forEach(r => (by[r.date] = by[r.date] || []).push(r));
  let cur = '', n = 0;

  if (list.length > LOG.lim) h += `<button class="btn ghost block" data-act="logmore">▼ 더 보기 (${list.length - LOG.lim}건 남음)</button>`;

function collect(s) {
  const o = {};
  s.querySelectorAll('[name]').forEach(el => { o[el.name] = el.type === 'checkbox' ? el.checked : el.classList.contains('dt') ? DV(el) : el.value; });
  s.querySelectorAll('.chips[data-f]').forEach(ch => { const on = ch.querySelector('.on'); o[ch.dataset.f] = on ? on.dataset.v : ''; });
  return o;
}
function submitForm() {
  if (!FORM || !FORM.type) return;
  const { type, old, newPh, removed, sheet } = FORM;
  const o = collect(sheet);
  if (!o.date) return toast('날짜를 입력해 주세요');
  const rec = old ? clone(old) : { id: uid(), type, by: ME, at: Date.now() };
  rec.type = type; rec.date = o.date;
  if (o.time !== undefined) rec.time = o.time;
  if (type === 'poop') {
    if (!o.score) return toast('응아 상태를 골라 주세요');
    Object.assign(rec, { score: +o.score, color: o.color || '', amount: o.amount || '', mucus: !!o.mucus, foreign: !!o.foreign, memo: o.memo.trim() });
  } else if (type === 'health') {
    if (!o.kind) return toast('항목을 골라 주세요');
    rec.kind = o.kind; rec.memo = o.memo.trim();
    const hp = (o.hospital || '').trim(), dr = (o.doctor || '').trim(), am = num(o.amount);
    if (hp) rec.hospital = hp; else delete rec.hospital;
    if (dr) rec.doctor = dr; else delete rec.doctor;
    if (am > 0) rec.amount = am; else delete rec.amount;
    const w = num(o.weight);
    if (w > 0) rec.weight = w; else delete rec.weight;
    if (o.kind === '체중' && !(w > 0)) return toast('체중을 입력해 주세요');
  } else if (type === 'walk') {
    const m = num(o.min);
    if (!(m > 0)) return toast('산책 시간(분)을 입력해 주세요');
    Object.assign(rec, { min: m, memo: o.memo.trim() });
  } else if (type === 'expense') {
    const a = num(o.amount);
    if (!(a > 0)) return toast('금액을 입력해 주세요');
    Object.assign(rec, { cat: o.cat || '기타', amount: a, memo: o.memo.trim() });
  } else if (type === 'memo') {
    const keep = (rec.photos || []).filter(p => !removed.includes(p.id)).length + newPh.length;
    if (!o.text.trim() && !keep) return toast('내용이나 사진을 넣어 주세요');
    rec.text = o.text.trim();
  } else if (type === 'event') {
    if (!o.title.trim()) return toast('제목을 입력해 주세요');
    Object.assign(rec, { cat: o.cat || '기타', title: o.title.trim(), memo: o.memo.trim(), rep: repCode(o.rep) });
  } else if (type === 'meal') {
    Object.assign(rec, { kind: o.kind === '간식' ? '간식' : '식사', memo: (o.memo || '').trim() });
  } else if (type === 'supp') {
    if (!o.name) return toast('영양제를 골라 주세요');
    Object.assign(rec, { name: o.name, memo: (o.memo || '').trim() });
  } else if (type === 'buy') {
    if (!(o.name || '').trim()) return toast('구매한 것을 입력해 주세요');
    Object.assign(rec, { name: o.name.trim(), price: num(o.price), buyer: (o.buyer || '').trim(), memo: (o.memo || '').trim() });
  } else if (type === 'trip') {
    if (!o.place.trim()) return toast('어디를 갔는지 입력해 주세요');
    Object.assign(rec, { place: o.place.trim(), end: o.end || '', who: o.who.trim(), note: o.note.trim() });
  }
  if (old && old.by !== ME) rec.editedBy = ME;
  saveRec(rec, newPh, removed);
  UI.flash = rec.id; saveUI();
  closeM(); toast('저장했어요');
  setTimeout(() => { UI.flash = ''; }, 2200);
}
async function addPhoto(src) {
  if (!FORM || !FORM.type || !PHOTO_TYPES.includes(FORM.type)) return;
  const have = $('#phs').children.length;
  if (have >= maxPh(FORM.type)) return toast(`사진은 최대 ${maxPh(FORM.type)}장까지예요`);
  const a = await acquire(src);
  if (!a || !FORM) return;
  await addBlob(a.blob, a.crop);
}
async function addBlob(blob, crop) {
  if (!FORM || !PHOTO_TYPES.includes(FORM.type)) return;
  prog('사진 처리 중…');
  try {
    const r = await compress(blob, crop, FORM.type === 'trip' ? 720 : 480), nid = uid();
    FORM.newPh.push({ nid, ...r });
    $('#phs').insertAdjacentHTML('beforeend', `<div class="ph"><img src="${r.th}" alt=""><button type="button" data-act="phdel" data-nid="${nid}">×</button></div>`);
  } catch (e) { toast('사진을 처리하지 못했어요'); }
  prog('');
}
async function openPhoto(rid, pid) {
  const r = RECS.get(rid), p = r && (r.photos || []).find(x => x.id === pid);
  if (!p) return;
  const s = openM(`<div class="pv"><img id="pvi" src="${p.th}" alt=""><div class="sub" id="pvs">불러오는 중…</div></div>
    <div class="row"><button class="btn red" data-act="phrm" data-rid="${rid}" data-pid="${pid}">사진 삭제</button><button class="btn ghost" data-act="mclose">닫기</button></div>`);
  const cap = `${fmtD(r.date)} ${r.time || ''} · ${r.by || ''}`;
  if (p.x) { s.querySelector('#pvs').textContent = `${cap}\n원본은 백업 후 정리되어 작은 사진만 남아 있어요`; return; }
  try {
    const d = await getDoc(phRef(pid));
    if (d.exists()) { s.querySelector('#pvi').src = d.data().data; s.querySelector('#pvs').textContent = cap; }
    else s.querySelector('#pvs').textContent = `${cap}\n원본을 찾을 수 없어요`;
  } catch (e) { s.querySelector('#pvs').textContent = `${cap}\n오프라인이라 원본을 못 불러왔어요`; }
}

const PART_LIMIT = 60 * 1048576;
async function backupRange(from, to, withPhotos, label) {
  if (!navigator.onLine) { toast('인터넷 연결이 필요해요'); return null; }
  prog('기록 불러오는 중…');
  let recs;
  try {
    const s = await getDocs(query(fcol('records'), where('date', '>=', from), where('date', '<=', to)));
    recs = s.docs.map(d => ({ ...d.data(), id: d.id })).sort(cmpAsc);
  } catch (e) { prog(''); fail(e); return null; }
  const stamp = today();
  const head = { app: APP_ID, version: 2, exportedAt: new Date().toISOString(), range: [from, to],
    fam: { dog: FAM.dog, members: FAM.members, admin: FAM.admin, bdays: FAM.bdays || {} },
    supplies: [...SUPS.values()], friends: [...FRS.values()] };
  if (!withPhotos) {
    download(new Blob([JSON.stringify({ ...head, records: recs })], { type: 'application/json' }), `캉캉노트_기록_${stamp}.json`);
    famSet({ lastBackup: stamp }); prog('');
    toast(`기록 ${recs.length}건을 내려받았어요 (사진 원본 제외)`);
    return recs;
  }
  const total = recs.reduce((a, r) => a + (r.photos || []).filter(p => !p.x).length, 0);
  let bucket = { files: [], recs: [], bytes: 0 }, part = 0, done = 0;
  const flush = async () => {
    if (!bucket.recs.length) return;
    part++;
    const json = new TextEncoder().encode(JSON.stringify({ ...head, part, records: bucket.recs }));
    download(zipBuild([{ name: 'data.json', data: json }, ...bucket.files]), `캉캉노트_${label}_${stamp}_${part}.zip`);
    bucket = { files: [], recs: [], bytes: 0 };
    await sleep(900);
  };
  try {
    for (const r of recs) {
      for (const p of (r.photos || [])) {
        if (p.x) continue;
        prog(`사진 담는 중… ${++done}/${total}`);
        const d = await getDoc(phRef(p.id));
        if (d.exists()) { const u = dataUrlToU8(d.data().data); bucket.files.push({ name: `photos/${p.id}.jpg`, data: u }); bucket.bytes += u.length; }
      }
      bucket.recs.push(r);
      if (bucket.bytes >= PART_LIMIT) await flush();
    }
    await flush();
  } catch (e) { prog(''); fail(e); return null; }
  famSet({ lastBackup: stamp }); prog('');
  toast(`백업 ${part}개 파일을 내려받았어요`);
  return recs;
}
function openBackup() {
  const to = today(), from = addDays(to, -365);
  openM(`<h3>백업 내려받기</h3>
    <div class="two"><div><div class="lbl">시작일</div><input id="bf" type="text" inputmode="numeric" class="dt" maxlength="10" placeholder="2026.05.06" autocomplete="off" value="${showD(from)}"></div><div><div class="lbl">종료일</div><input id="bt" type="text" inputmode="numeric" class="dt" maxlength="10" placeholder="2026.05.06" autocomplete="off" value="${showD(to)}"></div></div>

async function restoreFiles(files) {
  if (!navigator.onLine) return toast('인터넷 연결이 필요해요');
  let nRec = 0, nPh = 0;
  try {
    for (const f of files) {
      prog(`${f.name} 읽는 중…`);
      let data, zip = null;
      if (/\.json$/i.test(f.name)) data = JSON.parse(await f.text());
      else { zip = await zipRead(f); const j = await zip.get('data.json'); if (!j) throw new Error('data.json이 없어요'); data = JSON.parse(new TextDecoder().decode(j)); }
      if (data.app !== APP_ID) throw new Error('캉캉 노트 백업 파일이 아니에요');
      const recs = data.records || [];
      let batch = writeBatch(db), n = 0;
      for (const r of recs) {
        const { id, ...body } = r;
        batch.set(recRef(id), body); n++; nRec++;
        if (n >= 400) { await batch.commit(); batch = writeBatch(db); n = 0; prog(`기록 복구 ${nRec}건…`); }
      }
      for (const s of (data.supplies || [])) { const { id, ...b } = s; batch.set(supRef(id), b); n++; }
      for (const s of (data.friends || [])) { const { id, ...b } = s; batch.set(frRef(id), b); n++; }
      if (n) await batch.commit();
      if (zip) {
        let pb = writeBatch(db), pn = 0;
        for (const name of zip.names.filter(x => x.startsWith('photos/'))) {
          const pid = name.slice(7).replace(/\.jpg$/, '');
          const owner = recs.find(r => (r.photos || []).some(p => p.id === pid));
          const dataUrl = await u8ToDataUrl(await zip.get(name));
          pb.set(phRef(pid), { data: dataUrl, rid: owner ? owner.id : '', size: dataUrl.length, date: owner ? owner.date : '' });
          pn++; nPh++;
          if (pn >= 15) { await pb.commit(); pb = writeBatch(db); pn = 0; prog(`사진 복구 ${nPh}장…`); }
        }
        if (pn) await pb.commit();
      }
    }
  } catch (e) { prog(''); console.error(e); return toast('복구 실패: ' + (e.message || '파일을 확인해 주세요')); }
  prog('');
  await recount(true);
  cfg().health.filter(h => +h.days > 0).forEach(h => recalcLast(h.name)); // 정기 일정 최근일 다시 계산
  toast(`복구 완료: 기록 ${nRec}건, 사진 ${nPh}장`);
}

async function recount(silent) {
  if (!navigator.onLine) return silent || toast('인터넷 연결이 필요해요');

    <p class="sub">선택한 날짜 이전의 사진 원본을 먼저 백업(zip)으로 내려받고, 확인 후 서버에서 지워요. 기록과 작은 사진(썸네일)은 남아 있어요.</p>

async function doCleanup(cut) {
  const recs = await backupRange('2000-01-01', cut, true, '정리전백업');
  if (!recs) return;
  const targets = recs.filter(r => (r.photos || []).some(p => !p.x));
  const cnt = targets.reduce((a, r) => a + r.photos.filter(p => !p.x).length, 0);
  if (!cnt) return toast('정리할 사진이 없어요');
  const bytes = targets.reduce((a, r) => a + r.photos.filter(p => !p.x).reduce((b, p) => b + p.size, 0), 0);
  const ok = await ask(`방금 내려받은 백업 파일을 안전한 곳에 저장했나요?\n사진 원본 ${cnt}장(약 ${mb(bytes)})을 서버에서 삭제해요.\n되돌릴 수 없어요.`, '삭제하기', true);
  if (!ok) return toast('정리를 취소했어요. 백업만 받아졌어요');
  try {
    let batch = writeBatch(db), n = 0, done = 0;
    for (const r of targets) {
      const nr = clone(r);
      for (const p of nr.photos) { if (p.x) continue; batch.delete(phRef(p.id)); p.x = 1; n++; done++; }
      const { id, ...body } = nr;
      batch.set(recRef(r.id), body); n++;
      if (n >= 400) { await batch.commit(); batch = writeBatch(db); n = 0; prog(`정리 중… ${done}/${cnt}`); }
    }
    if (n) await batch.commit();
  } catch (e) { prog(''); return fail(e); }
  prog('');
  await recount(true);
  toast(`사진 ${cnt}장을 정리했어요`);
}

    <input id="rst" autocomplete="off" placeholder="전체 초기화" style="margin-top:8px">
    <div class="row"><button class="btn ghost" data-act="mclose">취소</button><button class="btn red" id="rstgo" data-act="resetgo" disabled>초기화 실행</button></div>`),

Object.entries(EDITORS).forEach(([k, f]) => ACTS[k] = f);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const f = ACTS[t.dataset.act];
  if (f) f(t, e);
});
document.addEventListener('focusin', e => { const t = e.target; if (t.classList && t.classList.contains('dt')) setTimeout(() => { try { t.select(); } catch (x) {} }, 0); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('bd')) {
    const p = parseBd(t.value);
    if (p) { t.value = showBd(p); t.classList.remove('bad'); } else if (t.value.trim()) { t.classList.add('bad'); toast('생일을 확인해 주세요 (예: 19900506 또는 0506)'); } else t.classList.remove('bad');
    return;
  }
  if (t.classList && t.classList.contains('dt')) {
    const iso = normD(t.value);
    if (iso) { t.value = showD(iso); t.classList.remove('bad'); }
    else if (t.value.trim()) { t.classList.add('bad'); toast('날짜를 확인해 주세요 (예: 2026.05.06)'); }
    else t.classList.remove('bad');
  }
  if (t.id === 'logdate') { if (t.value) { LOG.date = t.value > today() ? today() : t.value; render(); } return; }
  if (t.id === 'logf' || t.id === 'logt') { LOG[t.id === 'logf' ? 'from' : 'to'] = DV(t); LOG.lim = 40; if (LOG.from && LOG.to && LOG.from > LOG.to) { const x = LOG.from; LOG.from = LOG.to; LOG.to = x; } render(); return; }
  if (TABLE && t.dataset && t.dataset.k !== undefined && t.tagName === 'SELECT') TABLE.rows[+t.dataset.i][t.dataset.k] = t.value;
});
let logT = 0;
document.addEventListener('compositionend', e => { if (e.target.id === 'logq') { LOG.q = e.target.value; LOG.lim = 40; refreshRes(); } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') LAST_TYPE = Date.now();
  if (t.classList && t.classList.contains('dt')) {
    let g = t.value.replace(/\D/g, '').slice(0, 8);
    const pv = (t.dataset.pv || '').replace(/\D/g, '');
    if (e.inputType === 'deleteContentBackward' && g === pv && g) g = g.slice(0, -1);
    const f = g.length > 6 ? g.slice(0, 4) + '.' + g.slice(4, 6) + '.' + g.slice(6) : g.length > 4 ? g.slice(0, 4) + '.' + g.slice(4) : g;
    if (t.value !== f) t.value = f;
    t.dataset.pv = f;
    t.classList.remove('bad');
  }
  if (t.id === 'logq' && !e.isComposing) { LOG.q = t.value; LOG.lim = 40; clearTimeout(logT); logT = setTimeout(refreshRes, 160); }
  if (t.id === 'hmemo') HMEMO = t.value;
  if (t.id === 'rst') { const g = $('#rstgo'); if (g) g.disabled = t.value.trim() !== '전체 초기화'; }

  if (t.dataset && t.dataset.money !== undefined) { const n = num(t.value); t.value = n ? n.toLocaleString('ko-KR') : ''; }
});

   18. 시작
   ===================================================================== */
function authReady() {
  return new Promise((res, rej) => {
    const un = onAuthStateChanged(auth, u => {
      if (u) { un(); res(u); } else signInAnonymously(auth).catch(err => { un(); rej(err); });
    });
  });
}
async function boot() {
  if (!location.hash && UI.route) history.replaceState(null, '', UI.route);
  history.replaceState({ r: 'exit' }, '', location.href);
  history.pushState({ r: 'app' }, '', location.href);
  try { await authReady(); }
  catch (e) { console.error(e); AUTH_ERR = 'auth'; }
  BOOTED = true; window.__ready = true;
  { let n = 0; const iv = setInterval(() => { if (FAM && SUPS) { clearInterval(iv); setTimeout(() => say('hello'), 600); } else if (++n > 20) clearInterval(iv); }, 500); }
  if (CODE && !AUTH_ERR) startSync();
  render();
}
boot();
